<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Sensing for the Commons — A CRSS Presentation Companion Guide</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,500&family=IBM+Plex+Sans:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@300;400;500;600&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..600&family=Spline+Sans+Mono:wght@400;500&family=Newsreader:ital,opsz,wght@0,6..72,300..600;1,6..72,300..500&display=swap" rel="stylesheet">

<style>
  :root {
    /* Blueprint palette, sensor blue + meaning clay, applied site-wide. */
    --paper:        #ffffff;
    --paper-2:      #eef3f9;
    --paper-3:      #e3ebf4;
    --paper-4:      #c2d0e0;

    --ink:          #11203a;
    --ink-2:        #33415c;
    --ink-3:        #5d6b86;
    --ink-4:        #8e9bb3;

    --rule:         #d8e1ec;
    --rule-soft:    #e8eef5;

    /* Existing accent names remapped onto Blueprint values so every
       reference across the codebase picks up the new palette. */
    --terra:        #c2410c;
    --terra-2:      #d2691e;
    --terra-tint:   #fbede2;

    --lapis:        #1f6feb;
    --lapis-2:      #5a90ef;
    --lapis-tint:   #e8f1fe;

    --ochre:        #b8730f;
    --ochre-2:      #d4a657;
    --ochre-tint:   #fbf3e4;

    --moss:         #0e7490;
    --moss-2:       #14b8a6;
    --moss-tint:    #e6f1f3;

    --plum:         #6d5ac2;
    --plum-2:       #9b87d8;
    --plum-tint:    #ede9fa;

    /* Blueprint-native aliases, for figures that want explicit names. */
    --sky:          #1f6feb;
    --sky-2:        #5a90ef;
    --sky-tint:     #e8f1fe;
    --clay:         #c2410c;
    --clay-2:       #d2691e;
    --clay-tint:    #fbede2;
    --navy:         #0b3a82;
    --amber:        #b8730f;
    --teal:         #0e7490;
    --protect:      #15803d;
    --protect-tint: #e6f2ea;
    --expose:       #c2410c;
    --expose-tint:  #fbe8df;

    --serif: "Spectral", "Iowan Old Style", Georgia, serif;
    --sans:  "IBM Plex Sans", system-ui, -apple-system, sans-serif;
    --mono:  "IBM Plex Mono", ui-monospace, Menlo, monospace;
  }

  html { scroll-behavior: smooth; }
  [id] { scroll-margin-top: 80px; }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--paper); color: var(--ink); }
  body {
    font-family: var(--sans);
    font-size: 15.5px;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    font-feature-settings: "ss01", "cv11";
  }

  a { color: inherit; }
  ::selection { background: var(--ochre-tint); color: var(--ink); }
  button { font: inherit; color: inherit; }

  .mono  { font-family: var(--mono); letter-spacing: 0.01em; }
  .serif { font-family: var(--serif); }
  .num   { font-family: var(--serif); font-variant-numeric: tabular-nums; font-feature-settings: "tnum"; }
  .caps  { text-transform: uppercase; letter-spacing: 0.16em; font-size: 11px; font-weight: 500; }
  .fr    { font-family: var(--serif); font-style: italic; font-weight: 400; }

  .wrap {
    max-width: 1280px;
    margin: 0 auto;
    padding: 0 56px;
  }

  /* Sticky chrome */
  .chrome {
    position: sticky; top: 0; z-index: 50;
    background: color-mix(in oklch, var(--paper) 92%, transparent);
    backdrop-filter: blur(10px) saturate(1.05);
    -webkit-backdrop-filter: blur(10px) saturate(1.05);
    border-bottom: 1px solid var(--rule);
  }
  .chrome-strip {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 56px; max-width: 1280px; margin: 0 auto;
    font-family: var(--mono); font-size: 11px; letter-spacing: 0.10em;
    color: var(--ink-3); text-transform: uppercase;
    border-bottom: 1px solid var(--rule-soft);
  }
  .chrome-tabs {
    display: flex; gap: 0; max-width: 1280px; margin: 0 auto;
    padding: 0 56px;
    overflow: hidden;
  }
  .tab {
    appearance: none; background: none; border: none; cursor: pointer;
    padding: 14px 0 16px; margin-right: 36px;
    font-family: var(--sans); font-size: 13.5px;
    color: var(--ink-3); position: relative;
    display: inline-flex; align-items: center; gap: 9px;
    white-space: nowrap;
    transition: color 160ms;
  }
  .tab .roman {
    font-family: var(--mono); font-size: 10px;
    letter-spacing: 0.16em;
    color: var(--tab-accent, var(--ink-4));
    opacity: 0.7;
    text-transform: uppercase;
    transition: opacity 160ms;
  }
  .tab .glyph {
    display: inline-block; width: 9px; height: 9px;
    background: var(--tab-accent, var(--ink-3));
    transform: rotate(45deg);
    opacity: 0.45;
    transition: opacity 160ms, transform 160ms;
  }
  .tab:hover { color: var(--ink); }
  .tab:hover .roman { opacity: 1; }
  .tab:hover .glyph { opacity: 0.85; }
  .tab.on { color: var(--ink); }
  .tab.on .roman { opacity: 1; }
  .tab.on .glyph { opacity: 1; transform: rotate(45deg) scale(1.25); }
  .tab.on::after {
    content: ""; position: absolute; left: 0; right: 0; bottom: -1px;
    height: 2px; background: var(--tab-accent, var(--terra));
  }

  /* ============================================================
     STRATA DESIGN TOKENS
     Five sections, each a layer of one earth-system cross-section.
     Naming: --st-<section>-<role>
     ============================================================ */
  :root {
    /* ACTIVE LAYER · intro — thaw surface */
    --st-active-bg-deep:#5c93ad; --st-active-bg:#7cb4cc; --st-active-bg-soft:#a9d4e6;
    --st-active-soil:#6b513a; --st-active-edge:#4a3826;
    --st-active-accent:#ffffff; --st-active-accent-2:#7fa8c0; --st-active-ink:#1d3b47;

    /* PERMAFROST · core ideas — frozen load-bearing substrate */
    --st-perma-bg-deep:#3f4f73; --st-perma-bg:#5d709a; --st-perma-bg-soft:#7d90b4;
    --st-perma-ice:#cfdcee; --st-perma-edge:#33405f;
    --st-perma-accent:#e3edf6; --st-perma-accent-2:#9fb4d0; --st-perma-ink:#1a2238;

    /* CANOPY · case studies — light-capturing, sits ABOVE surface */
    --st-canopy-sky:#cfe6f5; --st-canopy-bg-deep:#3d6e34; --st-canopy-bg:#5d9a4f;
    --st-canopy-bg-soft:#9ed086; --st-canopy-trunk:#5e4326; --st-canopy-edge:#2f5d34;
    --st-canopy-accent:#a8d68f; --st-canopy-accent-2:#356b2d; --st-canopy-ink:#20381c;

    /* RHIZOSPHERE · field guide / toolkit — root-soil exchange */
    --st-rhizo-bg-deep:#5f4628; --st-rhizo-bg:#9a7748; --st-rhizo-bg-soft:#b89668;
    --st-rhizo-root:#6e4d28; --st-rhizo-edge:#4a3318;
    --st-rhizo-accent:#caa86f; --st-rhizo-accent-2:#7c5830; --st-rhizo-ink:#2e2113;

    /* SEAFLOOR · annexes / about — deepest, slow sediment; LIGHT ink */
    --st-floor-bg-deep:#0a232d; --st-floor-bg:#163d4c; --st-floor-bg-soft:#2e6577;
    --st-floor-sediment:#0a212a; --st-floor-edge:#06161d;
    --st-floor-accent:#4a7888; --st-floor-accent-2:#bfe0ec; --st-floor-ink:#cfe6f0;

    /* shared structural */
    --st-surface-line:#8bbdd4; --st-radius:10px; --st-card:108px; --st-stroke:0.75px;
  }
  @media (prefers-color-scheme: dark) {
    :root { --st-surface-line:#6fa6bf; }
  }

  /* Strata head, the per-section opening */
  .strata-head {
    display: grid; grid-template-columns: auto 1fr; gap: 32px;
    align-items: start; margin: 32px 0 44px; padding-block: 8px;
  }
  .strata-head__text { padding-top: 4px; }
  .strata-head__sub {
    font-family: var(--mono); font-size: 11px; letter-spacing: 0.16em;
    text-transform: uppercase; color: var(--accent, var(--ink-3));
    margin: 0 0 8px;
  }
  .strata-head__title {
    font-family: var(--serif); font-size: 42px; font-weight: 400;
    letter-spacing: -0.014em; line-height: 1.05;
    margin: 0 0 18px; padding-bottom: 10px;
    border-bottom: 2px solid var(--accent, var(--ink));
    display: inline-block; color: var(--ink);
  }
  .strata-head__epigraph {
    font-family: var(--serif); font-style: italic; font-size: 19px; line-height: 1.45;
    color: var(--accent, var(--ink-2)); margin: 0 0 16px; max-width: 48ch;
  }
  .strata-head__standfirst {
    font-size: 16px; line-height: 1.65; color: var(--ink-2);
    margin: 0; max-width: 64ch;
  }
  @media (max-width: 720px) {
    .strata-head { grid-template-columns: 1fr; gap: 18px; }
  }

  /* Layout */
  .pane { min-height: 100vh; }
  .pane.dark { background: var(--ink); color: var(--paper); }

  hr.rule { border: 0; border-top: 1px solid var(--rule); margin: 0; }

  /* Boot */
  #app .boot {
    display: flex; align-items: center; justify-content: center;
    height: 70vh; color: var(--ink-3); font-family: var(--mono);
    font-size: 11px; letter-spacing: 0.20em; text-transform: uppercase;
  }

  /* Universal text balance */
  h1, h2, h3 { text-wrap: balance; }
  p { text-wrap: pretty; }

  /* Detail polish */
  .kicker {
    font-family: var(--mono); font-size: 11px; letter-spacing: 0.20em;
    text-transform: uppercase; color: var(--terra);
  }
</style>
</head>
