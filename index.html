<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Sensing for the Commons — A CRSS Presentation Companion Guide</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,500&family=IBM+Plex+Sans:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
  :root {
    /* Blueprint palette, sensor blue + meaning clay, applied site-wide. */
    --paper:        #ffffff;
    --paper-2:      #eef3f9;
    --paper-3:      #e3ebf4;
    --paper-4:      #c2d0e0;

    --ink:          #11203a;
    --ink-2:        #33415c;
    --ink-3:        #5d6b86;
    --ink-4:        #8e9bb3;

    --rule:         #d8e1ec;
    --rule-soft:    #e8eef5;

    /* Existing accent names remapped onto Blueprint values so every
       reference across the codebase picks up the new palette. */
    --terra:        #c2410c;
    --terra-2:      #d2691e;
    --terra-tint:   #fbede2;

    --lapis:        #1f6feb;
    --lapis-2:      #5a90ef;
    --lapis-tint:   #e8f1fe;

    --ochre:        #b8730f;
    --ochre-2:      #d4a657;
    --ochre-tint:   #fbf3e4;

    --moss:         #0e7490;
    --moss-2:       #14b8a6;
    --moss-tint:    #e6f1f3;

    --plum:         #6d5ac2;
    --plum-2:       #9b87d8;
    --plum-tint:    #ede9fa;

    /* Blueprint-native aliases, for figures that want explicit names. */
    --sky:          #1f6feb;
    --sky-2:        #5a90ef;
    --sky-tint:     #e8f1fe;
    --clay:         #c2410c;
    --clay-2:       #d2691e;
    --clay-tint:    #fbede2;
    --navy:         #0b3a82;
    --amber:        #b8730f;
    --teal:         #0e7490;
    --protect:      #15803d;
    --protect-tint: #e6f2ea;
    --expose:       #c2410c;
    --expose-tint:  #fbe8df;

    --serif: "Spectral", "Iowan Old Style", Georgia, serif;
    --sans:  "IBM Plex Sans", system-ui, -apple-system, sans-serif;
    --mono:  "IBM Plex Mono", ui-monospace, Menlo, monospace;
  }

  html { scroll-behavior: smooth; }
  [id] { scroll-margin-top: 80px; }

  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; background: var(--paper); color: var(--ink);
    overflow-x: hidden;
  }
  html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  body {
    font-family: var(--sans);
    font-size: 15.5px;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    font-feature-settings: "ss01", "cv11";
    overflow-wrap: break-word;
    word-wrap: break-word;
  }
  img, svg, video { max-width: 100%; }

  a { color: inherit; }
  ::selection { background: var(--ochre-tint); color: var(--ink); }
  button { font: inherit; color: inherit; }

  .mono  { font-family: var(--mono); letter-spacing: 0.01em; }
  .serif { font-family: var(--serif); }
  .num   { font-family: var(--serif); font-variant-numeric: tabular-nums; font-feature-settings: "tnum"; }
  .caps  { text-transform: uppercase; letter-spacing: 0.16em; font-size: 11px; font-weight: 500; }
  .fr    { font-family: var(--serif); font-style: italic; font-weight: 400; }

  .wrap {
    max-width: 1280px;
    margin: 0 auto;
    padding: 0 56px;
  }

  /* Sticky chrome */
  .chrome {
    position: sticky; top: 0; z-index: 50;
    background: color-mix(in oklch, var(--paper) 92%, transparent);
    backdrop-filter: blur(10px) saturate(1.05);
    -webkit-backdrop-filter: blur(10px) saturate(1.05);
    border-bottom: 1px solid var(--rule);
  }
  .chrome-strip {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 56px; max-width: 1280px; margin: 0 auto;
    font-family: var(--mono); font-size: 11px; letter-spacing: 0.10em;
    color: var(--ink-3); text-transform: uppercase;
    border-bottom: 1px solid var(--rule-soft);
    gap: 16px;
  }
  .chrome-byline {
    color: var(--ink-2); font-weight: 500;
    white-space: nowrap;
  }
  @media (max-width: 760px) {
    .chrome-strip { padding: 10px 16px; font-size: 10px; }
    .chrome-byline { font-size: 10px; }
  }
  .chrome-tabs {
    display: grid; grid-template-columns: repeat(5, 1fr);
    gap: 0; max-width: 1280px; margin: 0 auto;
    padding: 0 56px;
  }
  .tab-card {
    appearance: none; background: none; border: none; cursor: pointer;
    padding: 8px 14px 10px; text-align: left;
    display: flex; flex-direction: column; align-items: flex-start;
    gap: 5px; color: var(--ink-3);
    position: relative;
    border-right: 1px solid var(--rule-soft);
    transition: background 160ms, color 160ms;
  }
  .tab-card:last-child { border-right: none; }
  .tab-card .tab-strip {
    display: block; width: 100%; height: 22px;
    border-radius: 3px; overflow: hidden;
    box-shadow: inset 0 0 0 1px rgba(17, 32, 58, 0.08);
    opacity: 0.62;
    transition: opacity 200ms, transform 200ms;
  }
  .tab-card .tab-label {
    font-family: var(--serif); font-size: 14.5px; font-weight: 500;
    letter-spacing: -0.005em;
    color: var(--ink-3);
    transition: color 160ms;
    display: inline-flex; align-items: baseline; gap: 6px;
  }
  .tab-card .tab-caret {
    font-size: 11px; color: var(--tab-accent, var(--ink-3));
    transition: transform 160ms;
  }
  .tab-card .tab-sub {
    font-family: var(--mono); font-size: 9.5px;
    letter-spacing: 0.16em; text-transform: uppercase;
    color: var(--ink-4);
    transition: color 160ms;
  }
  .tab-card:hover { background: var(--rule-soft); color: var(--ink); }
  .tab-card:hover .tab-strip { opacity: 0.85; }
  .tab-card:hover .tab-label { color: var(--ink); }
  .tab-card.on {
    background: color-mix(in oklch, var(--tab-accent) 22%, var(--paper));
  }
  .tab-card.on .tab-strip { opacity: 1; }
  .tab-card.on .tab-label { color: var(--ink); font-weight: 700; }
  .tab-card.on .tab-sub { color: var(--tab-accent, var(--ink-3)); }
  .tab-card.on::after {
    content: ""; position: absolute; left: 0; right: 0; bottom: -1px;
    height: 3px; background: var(--tab-accent, var(--terra));
  }
  @media (max-width: 760px) {
    .chrome-tabs { padding: 0 16px; }
    .tab-card { padding: 10px 10px 12px; gap: 6px; }
    .tab-card .tab-strip { height: 22px; }
    .tab-card .tab-label { font-size: 14px; }
    .tab-card .tab-sub { font-size: 9px; letter-spacing: 0.14em; }
  }

  /* Per-tab intro panel, sits directly under the chrome.
     The text content is sized to fit alongside the 108px pictogram. */
  .section-intro {
    background: color-mix(in oklch, var(--accent, var(--rule)) 16%, var(--paper));
    border-bottom: 1px solid color-mix(in oklch, var(--accent, var(--rule)) 28%, var(--rule));
  }
  .section-intro__inner {
    max-width: 1000px; margin: 0 auto;
    padding: 22px 56px;
    display: grid; grid-template-columns: 108px 1fr;
    grid-template-rows: 108px;
    gap: 32px; align-items: stretch;
  }
  .section-intro__glyph {
    flex: 0 0 auto;
    width: 108px; height: 108px;
    display: flex; align-items: center; justify-content: center;
    filter: drop-shadow(0 8px 18px rgba(31, 42, 64, 0.10));
  }
  .section-intro__glyph svg { width: 108px !important; height: 108px !important; display: block; }
  .section-intro__text {
    min-width: 0; height: 108px;
    display: flex; flex-direction: column; justify-content: space-between;
    overflow: hidden;
  }
  .section-intro__epigraph {
    font-family: var(--serif); font-style: italic; font-weight: 400;
    font-size: 14.5px; line-height: 1.3;
    color: var(--ink); margin: 0;
    letter-spacing: -0.005em;
  }
  .section-intro__body {
    font-family: var(--sans); font-size: 12.5px; line-height: 1.45;
    color: var(--ink-2); margin: 0;
    max-width: 760px;
    display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .section-intro__row {
    display: grid; grid-template-columns: auto 1fr;
    gap: 12px; align-items: baseline;
    padding-top: 6px;
    border-top: 1px solid color-mix(in oklch, var(--accent, var(--rule)) 28%, var(--rule-soft));
  }
  .section-intro__tag {
    font-family: var(--mono); font-size: 9.5px;
    letter-spacing: 0.18em; text-transform: uppercase;
    color: var(--ink); font-weight: 600;
    background: color-mix(in oklch, var(--accent, var(--terra)) 36%, var(--paper));
    padding: 3px 8px;
    align-self: start;
    white-space: nowrap;
  }
  .section-intro__list {
    font-family: var(--sans); font-size: 12.5px; line-height: 1.45;
    color: var(--ink-2); max-width: 680px;
  }
  @media (max-width: 760px) {
    .section-intro__inner {
      grid-template-columns: 72px 1fr; gap: 16px;
      grid-template-rows: 72px;
      padding: 16px 20px;
    }
    .section-intro__glyph { width: 72px; height: 72px; }
    .section-intro__glyph svg { width: 72px !important; height: 72px !important; }
    .section-intro__text { height: 72px; }
    .section-intro__epigraph { font-size: 13px; }
    .section-intro__body { font-size: 11.5px; -webkit-line-clamp: 2; }
    .section-intro__row { gap: 10px; }
    .section-intro__list { font-size: 11.5px; }
    .section-intro__tag { font-size: 9px; padding: 2px 6px; }
  }
  @media (max-width: 760px) {
    .section-intro__epigraph { font-size: 18px; }
    .section-intro__body { font-size: 14.5px; }
    .section-intro__row { grid-template-columns: 1fr; gap: 10px; }
  }

  /* Defaults indictment — landscape table-spread flip cards.
     The card reserves its grid space with aspect-ratio; the __inner is
     absolutely positioned so it can grow to a fixed large size on hover
     and flip without disturbing the grid. */
  .defaults-table {
    display: grid; grid-template-columns: repeat(5, 1fr);
    gap: 28px 22px; padding: 22px 0 32px;
    overflow: visible;
  }
  @media (max-width: 1180px) { .defaults-table { grid-template-columns: repeat(4, 1fr); } }
  @media (max-width: 960px)  { .defaults-table { grid-template-columns: repeat(3, 1fr); } }
  @media (max-width: 680px)  { .defaults-table { grid-template-columns: repeat(2, 1fr); } }
  .default-card {
    appearance: none; border: none; background: none; padding: 0;
    cursor: pointer; text-align: left; color: var(--ink);
    font-family: var(--sans);
    position: relative;
    aspect-ratio: 8 / 5;
    perspective: 1500px;
    z-index: 1;
    transition: filter .35s ease, opacity .35s ease;
    filter: grayscale(0.92) brightness(0.96);
    opacity: 0.78;
  }
  .default-card:hover,
  .default-card:focus-visible,
  .default-card[aria-pressed="true"] {
    filter: none;
    opacity: 1;
    z-index: 50;
  }
  .default-card[aria-pressed="true"] { z-index: 60; }
  .default-card__inner {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    transform-style: preserve-3d;
    box-shadow: 0 4px 12px rgba(31, 42, 64, 0.14);
    border-radius: 8px;
    transition:
      top .4s cubic-bezier(.2,.7,.3,1),
      left .4s cubic-bezier(.2,.7,.3,1),
      width .4s cubic-bezier(.2,.7,.3,1),
      height .4s cubic-bezier(.2,.7,.3,1),
      margin .4s cubic-bezier(.2,.7,.3,1),
      transform 700ms cubic-bezier(.2,.7,.3,1),
      box-shadow .35s ease;
  }
  /* Hover pops the card out to a large size, still showing the front */
  .default-card:hover .default-card__inner {
    top: 50%; left: 50%;
    width: 600px; height: 375px;
    margin-top: -187.5px; margin-left: -300px;
    box-shadow: 0 26px 52px -12px rgba(31, 42, 64, 0.40);
  }
  /* Flipped (pressed) — grows even bigger so the back text fits comfortably */
  .default-card[aria-pressed="true"] .default-card__inner {
    top: 50%; left: 50%;
    width: 720px; height: 450px;
    margin-top: -225px; margin-left: -360px;
    transform: rotateY(180deg);
    box-shadow: 0 32px 64px -14px rgba(31, 42, 64, 0.48);
  }
  .default-card__face {
    position: absolute; inset: 0; backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
    border-radius: 8px; overflow: hidden;
    display: flex; flex-direction: column;
  }
  .default-card__front {
    background: #fdfcf8;
    border: 1px solid rgba(17, 32, 58, 0.10);
    padding: 0;
  }
  .default-card__front img {
    width: 100%; height: 100%;
    object-fit: cover; display: block;
  }
  .default-card__back {
    background: linear-gradient(165deg, #c2410c 0%, #7a2906 100%);
    color: #ffffff;
    transform: rotateY(180deg);
    padding: 26px 32px 28px;
    overflow: auto;
    position: relative;
  }
  .default-card__back .mono { color: rgba(255, 255, 255, 0.78) !important; }
  .default-card__back .serif { color: #ffffff !important; }

  /* Close X — top-right on the back face. Pointer events only when
     the card is actually open so it never absorbs front-face clicks. */
  .default-card__close {
    position: absolute; top: 10px; right: 10px;
    appearance: none; border: none; background: rgba(255, 255, 255, 0.16);
    color: #ffffff;
    width: 32px; height: 32px; border-radius: 50%;
    font-size: 20px; line-height: 1; font-weight: 400;
    cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center;
    padding: 0; transition: background .18s, transform .18s;
    z-index: 2;
  }
  .default-card__close:hover { background: rgba(255, 255, 255, 0.3); transform: scale(1.06); }
  .default-card__close:focus-visible { outline: 2px solid #ffffff; outline-offset: 2px; }

  /* Backdrop (only visible when a card is open) — clicking it closes
     any open card. On desktop it's faint; on phone it dims everything
     and the card becomes a centred modal. */
  .default-card__backdrop {
    position: fixed; inset: 0;
    background: rgba(28, 34, 48, 0);
    z-index: 40;
    pointer-events: auto;
    transition: background .25s ease;
  }
  body.default-card-modal-open .default-card__backdrop { background: rgba(28, 34, 48, 0.42); }
  .default-card__head {
    display: flex; justify-content: space-between; align-items: center;
    flex: 0 0 auto; margin-bottom: 14px;
  }
  .default-card__answer {
    font-size: 26px; line-height: 1.2; font-weight: 500;
    letter-spacing: -0.012em; color: #ffffff;
    margin-top: 0;
  }
  .default-card__body {
    margin: 12px 0 0; font-size: 15px; line-height: 1.55;
    color: rgba(255, 255, 255, 0.94);
    flex: 1 1 auto;
  }
  .default-card__qa {
    margin-top: 14px; padding-top: 12px;
    border-top: 1px solid rgba(255, 255, 255, 0.3);
    display: grid; grid-template-columns: 1fr 1fr; gap: 18px;
  }
  .default-card__qa p { color: #ffffff !important; font-size: 14.5px !important; }
  .default-card__qa .mono { color: rgba(255, 255, 255, 0.78); }

  /* Case study Abstract callout */
  .case-abstract {
    margin: 0 0 40px;
    padding: 22px 30px 28px;
    background: color-mix(in oklch, var(--abstract-color, var(--lapis)) 5%, var(--paper));
    border: 1px solid var(--rule);
    border-top: 2px solid var(--abstract-color, var(--lapis));
    border-radius: 4px;
    animation: caseAbstractIn 620ms cubic-bezier(.22,.65,.3,1) both;
    animation-delay: 220ms;
  }
  @keyframes caseAbstractIn {
    from { opacity: 0; transform: translateY(14px); }
    to   { opacity: 1; transform: none; }
  }
  .case-abstract__head {
    display: flex; justify-content: space-between; align-items: center;
    gap: 16px; padding-bottom: 18px; flex-wrap: wrap;
  }
  .case-abstract__kicker {
    display: inline-flex; align-items: center; gap: 10px;
    font-family: var(--mono); font-size: 11px; letter-spacing: 0.22em;
    text-transform: uppercase; color: var(--abstract-color, var(--lapis));
    font-weight: 600;
  }
  .case-abstract__dot {
    color: var(--abstract-color, var(--lapis));
    font-size: 9px; transform: translateY(-1px);
  }
  .case-abstract__meta {
    font-family: var(--mono); font-size: 11px; letter-spacing: 0.18em;
    text-transform: uppercase; color: var(--ink-3); font-weight: 500;
  }
  .case-abstract__lead {
    margin: 0 0 16px;
    font-family: var(--serif); font-size: 21px; line-height: 1.42;
    font-weight: 500; letter-spacing: -0.008em; color: var(--ink);
    display: block;
    animation: caseAbstractIn 620ms cubic-bezier(.22,.65,.3,1) both;
    animation-delay: 360ms;
  }
  .case-abstract__dropcap {
    font-family: var(--serif); font-size: 56px; line-height: 0.85;
    font-weight: 500; color: var(--abstract-color, var(--lapis));
    float: left; padding: 4px 12px 0 0;
  }
  .case-abstract__body {
    columns: 2; column-gap: 36px;
    font-family: var(--serif); font-size: 15.5px; line-height: 1.6;
    color: var(--ink-2);
    animation: caseAbstractIn 620ms cubic-bezier(.22,.65,.3,1) both;
    animation-delay: 480ms;
  }
  .case-abstract__body p { margin: 0; }
  @media (max-width: 760px) {
    .case-abstract { padding: 18px 18px 22px; }
    .case-abstract__lead { font-size: 18px; }
    .case-abstract__dropcap { font-size: 44px; padding-right: 10px; }
    .case-abstract__body { columns: 1; font-size: 14.5px; }
  }

  /* ============================================================
     STRATA DESIGN TOKENS
     Five sections, each a layer of one earth-system cross-section.
     Naming: --st-<section>-<role>
     ============================================================ */
  :root {
    /* ACTIVE LAYER · intro — thaw surface */
    --st-active-bg-deep:#b27214; --st-active-bg:#df9128; --st-active-bg-soft:#f1c378;
    --st-active-soil:#6b513a; --st-active-edge:#4a3826;
    --st-active-accent:#ffffff; --st-active-accent-2:#df9128; --st-active-ink:#3a2210;

    /* PERMAFROST · core ideas — frozen load-bearing substrate */
    --st-perma-bg-deep:#3f4f73; --st-perma-bg:#5d709a; --st-perma-bg-soft:#7d90b4;
    --st-perma-ice:#cfdcee; --st-perma-edge:#33405f;
    --st-perma-accent:#e3edf6; --st-perma-accent-2:#9fb4d0; --st-perma-ink:#1a2238;

    /* CANOPY · case studies — light-capturing, sits ABOVE surface */
    --st-canopy-sky:#cfe6f5; --st-canopy-bg-deep:#3d6e34; --st-canopy-bg:#5d9a4f;
    --st-canopy-bg-soft:#9ed086; --st-canopy-trunk:#5e4326; --st-canopy-edge:#2f5d34;
    --st-canopy-accent:#a8d68f; --st-canopy-accent-2:#356b2d; --st-canopy-ink:#20381c;

    /* RHIZOSPHERE · field guide / toolkit — root-soil exchange */
    --st-rhizo-bg-deep:#5f4628; --st-rhizo-bg:#9a7748; --st-rhizo-bg-soft:#b89668;
    --st-rhizo-root:#6e4d28; --st-rhizo-edge:#4a3318;
    --st-rhizo-accent:#caa86f; --st-rhizo-accent-2:#7c5830; --st-rhizo-ink:#2e2113;

    /* SEAFLOOR · annexes / about — deepest, slow sediment; LIGHT ink */
    --st-floor-bg-deep:#0d3a3a; --st-floor-bg:#1a7878; --st-floor-bg-soft:#3eb4af;
    --st-floor-sediment:#0a3030; --st-floor-edge:#062424;
    --st-floor-accent:#3eb4af; --st-floor-accent-2:#a7e0dc; --st-floor-ink:#d6f1ee;

    /* shared structural */
    --st-surface-line:#8bbdd4; --st-radius:10px; --st-card:108px; --st-stroke:0.75px;
  }
  @media (prefers-color-scheme: dark) {
    :root { --st-surface-line:#6fa6bf; }
  }

  /* Strata head, the per-section opening */
  .strata-head {
    display: grid; grid-template-columns: auto 1fr; gap: 32px;
    align-items: start; margin: 32px 0 44px; padding-block: 8px;
  }
  .strata-head__text { padding-top: 4px; }
  .strata-head__sub {
    font-family: var(--mono); font-size: 11px; letter-spacing: 0.16em;
    text-transform: uppercase; color: var(--accent, var(--ink-3));
    margin: 0 0 8px;
  }
  .strata-head__title {
    font-family: var(--serif); font-size: 42px; font-weight: 400;
    letter-spacing: -0.014em; line-height: 1.05;
    margin: 0 0 18px; padding-bottom: 10px;
    border-bottom: 2px solid var(--accent, var(--ink));
    display: inline-block; color: var(--ink);
  }
  .strata-head__epigraph {
    font-family: var(--serif); font-style: italic; font-size: 19px; line-height: 1.45;
    color: var(--accent, var(--ink-2)); margin: 0 0 16px; max-width: 48ch;
  }
  .strata-head__standfirst {
    font-size: 16px; line-height: 1.65; color: var(--ink-2);
    margin: 0; max-width: 64ch;
  }
  @media (max-width: 720px) {
    .strata-head { grid-template-columns: 1fr; gap: 18px; }
  }

  /* Layout */
  .pane { min-height: 100vh; }
  .pane.dark { background: var(--ink); color: var(--paper); }

  hr.rule { border: 0; border-top: 1px solid var(--rule); margin: 0; }

  /* Boot */
  #app .boot {
    display: flex; align-items: center; justify-content: center;
    height: 70vh; color: var(--ink-3); font-family: var(--mono);
    font-size: 11px; letter-spacing: 0.20em; text-transform: uppercase;
  }

  /* Universal text balance */
  h1, h2, h3 { text-wrap: balance; }
  p { text-wrap: pretty; }

  /* Detail polish */
  .kicker {
    font-family: var(--mono); font-size: 11px; letter-spacing: 0.20em;
    text-transform: uppercase; color: var(--terra);
  }

  /* ============================================================
     MOBILE RESPONSIVE
     Catch-all rules that adapt every tab body, sub-nav, and Fig
     grid to a phone-sized viewport. Inline styles in JSX components
     are overridden by !important here so we don't have to refactor
     every padding/grid-template-columns on every component.
     ============================================================ */
  @media (max-width: 760px) {
    /* Layout containers — collapse the 56px horizontal padding that
       many tab bodies set inline. */
    .wrap, body .wrap {
      padding-left: 16px !important;
      padding-right: 16px !important;
    }

    /* Top-level chrome tab cards — tighter labels so 5 cards fit a
       phone viewport without overflow. */
    .chrome-tabs .tab-card { padding: 8px 6px 10px !important; gap: 4px !important; }
    .chrome-tabs .tab-card .tab-strip { height: 18px !important; }
    .chrome-tabs .tab-card .tab-label { font-size: 11.5px !important; letter-spacing: -0.005em; }
    .chrome-tabs .tab-card .tab-sub { font-size: 8px !important; letter-spacing: 0.12em !important; }
    .chrome-tabs .tab-card .tab-caret { font-size: 9px; }

    /* Permafrost masthead h1 — reduce the giant question type */
    .wrap > header h1 {
      font-size: 24px !important;
      line-height: 1.2 !important;
      letter-spacing: -0.018em !important;
    }
    /* Permafrost sub-nav (PermaSubNav) — let the 5 tabs wrap or scroll */
    .wrap > div[style*="grid-template-columns: repeat(5, 1fr)"] {
      grid-template-columns: repeat(5, minmax(0, 1fr)) !important;
    }
    .wrap > div[style*="repeat(5, 1fr)"] .serif {
      font-size: 11px !important;
      line-height: 1.18 !important;
    }
    .wrap > div[style*="repeat(5, 1fr)"] .mono {
      font-size: 8.5px !important;
      letter-spacing: 0.12em !important;
    }
    .wrap > div[style*="repeat(5, 1fr)"] button {
      padding: 10px 6px 12px !important;
      min-height: 56px !important;
    }

    /* Fig* widget grids — stack 2-column layouts vertically */
    div[style*="grid-template-columns: \"230px 1fr\""],
    div[style*="grid-template-columns:\"230px 1fr\""],
    div[style*="grid-template-columns: \"1fr 300px\""],
    div[style*="grid-template-columns:\"1fr 300px\""],
    div[style*="minmax(320px, 1fr) minmax(360px, 1.1fr)"],
    div[style*="grid-template-columns: \"1fr 1fr\""],
    div[style*="grid-template-columns:\"1fr 1fr\""],
    div[style*="grid-template-columns: \"1.2fr 1.4fr 1fr\""],
    div[style*="grid-template-columns: \"130px 1fr 1fr\""],
    div[style*="grid-template-columns: \"60px 1fr\""],
    div[style*="grid-template-columns: \"44px 1fr\""],
    div[style*="grid-template-columns: \"48px 1fr\""],
    div[style*="grid-template-columns: \"80px 1fr\""],
    div[style*="grid-template-columns: \"110px 1fr\""],
    div[style*="grid-template-columns: \"180px 1fr\""],
    div[style*="grid-template-columns: \"1fr 1.4fr\""],
    div[style*="grid-template-columns: \"1fr 1.1fr\""],
    div[style*="grid-template-columns: \"auto 1fr\""],
    div[style*="grid-template-columns: \"repeat(3, 1fr)\""],
    div[style*="grid-template-columns: \"repeat(4, 1fr)\""],
    article[style*="grid-template-columns: \"auto 1fr\""],
    section[style*="grid-template-columns: \"auto 1fr\""] {
      grid-template-columns: 1fr !important;
      gap: 14px !important;
    }

    /* Field guide / case-study tab strips that use repeat(4,...) */
    .wrap div[style*="repeat(4, 1fr)"] {
      grid-template-columns: 1fr 1fr !important;
      gap: 8px !important;
    }

    /* PFMovement big roman numeral — shrink so it doesn't push the name */
    .wrap section[style*="scrollMarginTop: 80px"] .num,
    .wrap section[style*="scroll-margin-top: 80px"] .num,
    .wrap section .num[style*="fontSize: 90px"],
    .wrap section .num[style*="font-size: 90px"] {
      font-size: 48px !important;
    }
    /* PFMovement h2 — keep readable */
    .wrap section h2[style*="font-size: 40px"],
    .wrap section h2[style*="fontSize: 40px"] {
      font-size: 26px !important;
      line-height: 1.12 !important;
    }

    /* Block titles (PFBlock h3) — already 26px from the standardization */
    .wrap section h3 { font-size: 21px !important; line-height: 1.22 !important; }

    /* All in-body paragraphs scale to a comfortable phone size */
    .wrap section p, .wrap section li { font-size: 14.5px !important; line-height: 1.6 !important; }

    /* Hero "Sensing for the Commons" h1 on the Introduction tab */
    .wrap h1[style*="font-size: 88px"],
    .wrap h1[style*="fontSize: 88px"],
    .wrap h1[style*="white-space: nowrap"] {
      font-size: 38px !important;
      line-height: 1.0 !important;
      white-space: normal !important;
    }

    /* Defaults table on phone — no hover-pop, and a flipped card becomes
       a centred modal anchored to the viewport (not the grid cell), so
       it can grow vertically and stay readable on a small screen. */
    .default-card:hover .default-card__inner { /* hover not a thing on touch */
      top: 0 !important; left: 0 !important;
      width: 100% !important; height: 100% !important;
      margin: 0 !important;
    }
    .default-card[aria-pressed="true"] .default-card__inner {
      position: fixed !important;
      top: 50% !important; left: 50% !important;
      width: 92vw !important; max-width: 480px;
      height: auto !important; aspect-ratio: 8 / 5;
      max-height: 86vh;
      margin: 0 !important;
      transform: translate(-50%, -50%) rotateY(180deg) !important;
      z-index: 100 !important;
    }
    .default-card__back { padding: 18px 18px 20px !important; }
    .default-card__answer { font-size: 18px !important; }
    .default-card__body { font-size: 13px !important; }
    .default-card__qa { grid-template-columns: 1fr !important; gap: 10px !important; }
    .default-card__qa p { font-size: 13px !important; }
    .default-card__close { width: 36px !important; height: 36px !important; font-size: 22px !important; }

    /* Lock body scroll while a card is open on phone */
    body.default-card-modal-open { overflow: hidden !important; }

    /* Tables that have min-width set — scroll horizontally inside their container */
    .wrap div[style*="overflow: auto"] table,
    .wrap div[style*="overflow:auto"] table { font-size: 12.5px !important; }

    /* Chrome byline gets cramped — hide on the smallest screens */
    .chrome-strip .chrome-byline { display: none; }

    /* Case-study TabDeepDive tab grid */
    .wrap > div > div[style*="gridTemplateColumns"][style*="repeat"] { gap: 8px !important; }

    /* The two-column intro on the Introduction tab if it ever appears */
    .intro-grid { grid-template-columns: 1fr !important; gap: 22px !important; }

    /* Bookend image grid (Plato/Aristotle) stack */
    section[style*="grid-template-columns: \"1fr 1fr\""] { grid-template-columns: 1fr !important; }

    /* Wheel + detail panel grid — let the wheel SVG come first, then the detail */
    .wrap div[style*="minmax(320px, 1fr) minmax(360px, 1.1fr)"] > div {
      border-right: none !important;
      border-bottom: 1px solid var(--rule) !important;
    }
    .wrap div[style*="minmax(320px, 1fr) minmax(360px, 1.1fr)"] > div:last-child {
      border-bottom: none !important;
    }
  }

  @media (max-width: 480px) {
    /* Even tighter for the smallest phones */
    .chrome-tabs .tab-card .tab-label { font-size: 10.5px !important; }
    .chrome-tabs .tab-card .tab-sub { font-size: 7.5px !important; }
    .wrap > header h1 { font-size: 21px !important; }
    .wrap section h3 { font-size: 19px !important; }
    .wrap section p, .wrap section li { font-size: 14px !important; }
    .case-abstract__lead { font-size: 16px !important; }
    .case-abstract__body { columns: 1 !important; font-size: 13.5px !important; }
  }
</style>
</head>
