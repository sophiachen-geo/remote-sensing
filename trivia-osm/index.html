const TABS = [
  {id:"quiz", label:"The Tile Game"},
  {id:"compare", label:"The See-Saw"},
  {id:"deep", label:"The Sandbox"},
  {id:"mm", label:"The Tool Shed"},
  {id:"guide", label:"The Field Guide", right:true}
];
const LETTERS = ["A","B","C","D","E"];
const N = QUESTIONS.length;

/* ===================================================================
   STATE
   =================================================================== */
const S = {
  tab:"quiz", selected:null, score:0,
  answered:[], attemptsMap:{}, wrongMap:{},
  finished:false, displayScore:0, pop:false,
  // See-Saw
  cmpPos:50, cmpTarget:null,
  obsActive:null, obsAns:{},              // obsAns[key] = chosen option index
  claimPick:null, claimDone:false, claimHint:false,
  cards:{}, cardHint:{},                  // cards[key]=true once solved
  memFlip:{}, carIndex:0,                  // member 3D carousel: flip state + front index
  breakActive:false, breakLeft:60
};
let breakTimer=null;

/* ===================================================================
   HELPERS
   =================================================================== */
const restingCount = () => S.answered.filter(x=>x==="resting").length;
const remainingCount = () => N - S.score - restingCount();
const someProgress = () => S.score>0 || restingCount()>0;
const attempted = i => S.answered[i]==="correct" || S.answered[i]==="resting" || (S.attemptsMap[i]||0)>0;
function scrollTop(){ try{ window.scrollTo({top:0,behavior:"smooth"}); }catch(e){} }
// On phones the question sits below the tiles, so bring it into view; on wide
// screens the question is already beside the tiles, so no scroll is needed.
function revealPanel(){
  // bring the open question fully into view, centred, so it reads without scrolling
  try{
    const p=document.getElementById("chRight");
    if(p){ requestAnimationFrame(()=>p.scrollIntoView({behavior:"smooth",block:"center"})); return; }
  }catch(e){}
  scrollTop();
}

/* ===================================================================
   ACTIONS
   =================================================================== */
function goTab(name){ S.tab=name; render(); scrollTop(); }

/* ---- The See-Saw ---- */
const obsBy = k => OBS.find(o=>o.key===k);
const obsCount = () => Object.keys(S.obsAns).length;
function openObs(key){
  S.obsActive = (S.obsActive===key) ? null : key;
  if(S.obsActive){ S.cmpTarget = 50; } // glide to centre so both maps share the view — neither "leads"
  render();
}
function answerObs(key, idx){ S.obsAns[key]=idx; render(); }
function chooseClaim(idx){
  S.claimPick=idx;
  if(CLAIM.options[idx].best){ S.claimDone=true; S.claimHint=false; }
  else { S.claimHint=true; }
  render();
}
function answerCard(key, idx){
  const card=PUZZLE.find(c=>c.key===key);
  if(card.options[idx].ok){ S.cards[key]=true; S.cardHint[key]=false; }
  else { S.cardHint[key]=idx; }
  render();
}
function resetSeesaw(){
  S.obsActive=null; S.obsAns={}; S.claimPick=null; S.claimDone=false; S.claimHint=false; S.cards={}; S.cardHint={}; S.cmpPos=50; S.cmpTarget=null; render(); scrollTop();
}

function selectTile(i){
  if(S.breakActive) return; // mapping is locked during a movement break
  clearBreak();
  if(S.answered[i]==="resting"){ S.attemptsMap[i]=0; S.wrongMap[i]=[]; S.answered[i]=undefined; }
  S.selected=i; S.breakActive=false; render(); revealPanel();
}
function choose(opt){
  const i=S.selected;
  if(i===null || S.answered[i]==="correct" || S.answered[i]==="resting") return;
  if((S.wrongMap[i]||[]).indexOf(opt)!==-1) return;
  const q=QUESTIONS[i];
  if(opt===q.answer){
    S.answered[i]="correct"; S.score++; S.pop=true; render();
    setTimeout(()=>{S.pop=false; render();}, 320);
    if(S.score===N) setTimeout(showResults, 900);
    return;
  }
  S.wrongMap[i]=(S.wrongMap[i]||[]).concat([opt]);
  S.attemptsMap[i]=(S.attemptsMap[i]||0)+1;
  if(S.attemptsMap[i]>=3){ S.answered[i]="resting"; startBreak(); return; }
  render();
}
function backToMap(){ clearBreak(); S.selected=null; S.breakActive=false; render(); scrollTop(); }
function retryTile(){ const i=S.selected; clearBreak(); S.attemptsMap[i]=0; S.wrongMap[i]=[]; S.answered[i]=undefined; S.breakActive=false; render(); }
// A movement break starts automatically after three misses and locks the quiz
// for sixty seconds. There is no manual start, and no way to skip it.
function startBreak(){
  clearBreak(); S.breakActive=true; S.breakLeft=60; render();
  breakTimer=setInterval(()=>{
    S.breakLeft--;
    const el=document.getElementById("breakClock");
    if(S.breakLeft<=0){ clearBreak(); S.breakActive=false; render(); }
    else if(el){ el.textContent=fmtClock(S.breakLeft); }
  },1000);
}
function clearBreak(){ if(breakTimer){ clearInterval(breakTimer); breakTimer=null; } }
function fmtClock(s){ return Math.floor(s/60)+":"+String(s%60).padStart(2,"0"); }
function showResults(){ clearBreak(); S.finished=true; S.selected=null; S.displayScore=0; render(); animateScore(S.score); }
function keepMapping(){ S.finished=false; S.selected=null; render(); scrollTop(); }
function restart(){ clearBreak(); S.selected=null; S.score=0; S.answered=[]; S.attemptsMap={}; S.wrongMap={}; S.finished=false; S.displayScore=0; S.pop=false; S.breakActive=false; S.breakLeft=60; render(); scrollTop(); }
function animateScore(target){
  const start=performance.now(), dur=600;
  const tick=now=>{ const p=Math.min(1,(now-start)/dur); S.displayScore=Math.round(p*target); const el=document.getElementById("bigScore"); if(el) el.firstChild.textContent=S.displayScore; if(p<1) requestAnimationFrame(tick); };
  requestAnimationFrame(tick);
}

/* ===================================================================
   RENDER
   =================================================================== */
function render(){
  document.getElementById("tabs").innerHTML = TABS.map(t=>
    `<button class="${t.right?'tab-right':''}" data-act="tab" data-v="${t.id}" aria-selected="${S.tab===t.id}">${t.label}</button>`).join("");
  const app=document.getElementById("app");
  if(S.tab==="quiz") app.innerHTML = viewQuiz();
  else if(S.tab==="compare") app.innerHTML = viewCompare();
  else if(S.tab==="deep") app.innerHTML = viewDeep();
  else if(S.tab==="mm") app.innerHTML = viewMM();
  else if(S.tab==="guide") app.innerHTML = viewGuide();
  postRender();
}

function viewQuiz(){
  if(S.finished) return viewResults();
  const stats = `
    <div class="stats">
      <div class="stat"><div class="lbl">Mapped</div><div class="val red ${S.pop?'pop':''}">${S.score} / ${N}</div></div>
      <div class="stat"><div class="lbl">On a break</div><div class="val">${restingCount()}</div></div>
      <div class="stat"><div class="lbl">Remaining</div><div class="val">${remainingCount()}</div></div>
    </div>
    <div class="pbar"><i style="width:${S.score/N*100}%"></i></div>`;

  // Hard movement-break gate: while the 60s timer runs, the map is hidden and
  // every question is locked. The timer auto-started and cannot be skipped.
  if(S.selected!==null && S.answered[S.selected]==="resting" && S.breakActive){
    const i=S.selected, q=QUESTIONS[i], tcolor=TYPES[typeOf(q)].color;
    return `<section class="view">${stats}
      <div class="qpanel">
        <div class="qhead"><span class="chip" style="background:${tcolor}">${TYPES[typeOf(q)].label}</span></div>
        <div class="qmeta">Tile ${i+1} of 36</div>
        <h2 class="qtext">${q.q}</h2>
        <div class="breakp">
          <div class="eb">Take a movement break</div>
          <div class="clock on" id="breakClock">${fmtClock(S.breakLeft)}</div>
          <p>Three tries used on this tile. Mapping is paused for sixty seconds — stand up and do squats or stretch, or switch to another tab and read. When the timer reaches zero you will get three fresh tries on this tile.</p>
          <div class="lockline">Mapping is paused until the timer ends</div>
        </div>
      </div></section>`;
  }

  const tiles = QUESTIONS.map((q,i)=>{
    const a=S.answered[i], col=i%6, row=Math.floor(i/6);
    const tcolor=TYPES[typeOf(q)].color;
    const cls=["tile"]; if(i===S.selected) cls.push("sel"); if(a==="correct") cls.push("correct");
    let ov;
    if(a==="correct") ov=`<div class="ov"></div>`;
    else if(a==="resting") ov=`<div class="ov" style="background:${tcolor}"><span class="rest-glyph"><svg width="13" height="13" viewBox="0 0 24 24" fill="#fff"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg><span>${i+1}</span></span></div>`;
    else ov=`<div class="ov" style="background:${tcolor}">${i+1}</div>`;
    const aria=`Question ${i+1}, ${TYPES[typeOf(q)].label}${a==="correct"?", mapped":a==="resting"?", on a break":""}`;
    return `<button class="${cls.join(' ')}" style="background-position:${col*20}% ${row*20}%" data-act="selTile" data-v="${i}" aria-label="${aria}">${ov}</button>`;
  }).join("");
  const allMapped=S.score===N;
  const map = `
    <div class="mapgrid">${tiles}</div>
    <p class="mapcap ${allMapped?'done':''}">${allMapped?"You mapped the whole world.":"Tap any tile to answer that question."}</p>
    <div class="legend">${Object.keys(TYPES).map(k=>`<span class="it"><span class="dot" style="background:${TYPES[k].color}"></span>${TYPES[k].label}</span>`).join("")}</div>`;

  let panel;
  if(S.selected===null){
    panel = `<div class="pathcard">
        <div class="path-eyebrow">Choose your own path</div>
        <p>Pick any tile above to answer that question first. Get it right and the tile turns into a piece of the planet. Map all thirty-six and the whole Earth appears.</p>
      </div>` +
      (someProgress()? `<div style="text-align:center;margin-top:16px"><button class="btn outline" data-act="results">See my results so far</button></div>`:"");
  } else {
    const i=S.selected, q=QUESTIONS[i], tcolor=TYPES[typeOf(q)].color;
    const correct=S.answered[i]==="correct", resting=S.answered[i]==="resting";
    const wrong=S.wrongMap[i]||[], attempts=S.attemptsMap[i]||0;
    const head=`<div class="qhead"><span class="chip" style="background:${tcolor}">${TYPES[typeOf(q)].label}</span>
        <button class="btn ghost" data-act="back">← Back to the map</button></div>
      <div class="qmeta">Tile ${i+1} of 36</div>
      <h2 class="qtext">${q.q}</h2>`;
    let body;
    if(resting){
      // timer has finished (breakActive is false here) — offer the fresh round
      body=`<div class="breakp">
          <div class="eb">Break complete</div>
          <div class="clock on">0:00</div>
          <p>Nice work taking a breather. You now have three fresh tries on this tile.</p>
          <div class="row">
            <button class="b-red" data-act="retry">Try this tile again</button>
            <button class="b-out" data-act="back">Back to the map</button>
          </div>
        </div>`;
    } else {
      const opts=q.options.map((label,oi)=>{
        const isAns=oi===q.answer, isWrong=wrong.indexOf(oi)!==-1;
        const cls=["opt"]; let mark="";
        if(correct){ if(isAns){cls.push("right");mark="✓";} else cls.push("dim"); }
        else if(isWrong){ cls.push("wrong"); mark="✗"; }
        const dis=(correct||isWrong)?"disabled":"";
        return `<button class="${cls.join(' ')}" data-act="choose" data-v="${oi}" ${dis}>
            <span class="key">${LETTERS[oi]}</span><span class="lab">${label}</span><span class="mark">${mark}</span></button>`;
      }).join("");
      const attemptsLine = (!correct && attempts>0) ? `<div class="attempts">${3-attempts} of 3 tries left on this tile — take another look.</div>`:"";
      const explain = correct ? `<div class="explain"><b>Correct. </b>${q.explain}</div>
        <div class="qfoot"><button class="btn" data-act="${S.score===N?'results':'back'}">${S.score===N?"See results":"Back to the map"}</button></div>`:"";
      body=`<div class="opts">${opts}</div>${attemptsLine}${explain}`;
    }
    panel=`<div class="qpanel">${head}${body}</div>`;
  }
  return `<section class="view"><div class="challenge">
      <div class="ch-left">${stats}${map}</div>
      <div class="ch-right" id="chRight">${panel}</div>
    </div></section>`;
}

function viewResults(){
  const allMapped=S.score===N, pct=Math.round(S.score/N*100);
  const rank = pct===100?"Mapathon Lead": pct>=70?"Validator": pct>=40?"Field Mapper":"New Recruit";
  const msg = allMapped?"Flawless. You mapped every tile and revealed the whole planet.": pct>=70?"Strong work. You know the commons.": pct>=40?"A solid start. The Deep Dive is where it gets deeper.":"Plenty to explore. Try the Deep Dive, then keep mapping.";
  const top = allMapped
    ? `<img class="globe" src="assets/earth-globe.png" alt="A globe assembled from every correct answer"><div class="eyebrow" style="text-align:center">You mapped the whole world</div>`
    : `<div class="pin"><svg width="40" height="40" viewBox="0 0 24 24" fill="#fff"><path d="M12 22s7-7 7-12a7 7 0 0 0-14 0c0 5 7 12 7 12z"/><circle cx="12" cy="10" r="2.6" fill="#EE0000"/></svg></div>`;
  const rows = QUESTIONS.map((q,i)=>{
    if(!attempted(i)) return "";
    const ok=S.answered[i]==="correct";
    const detail = ok ? `<span class="ans">Answer: ${q.options[q.answer]}</span>` : `<span class="pending">Still on the map — give it another go.</span>`;
    return `<div class="brow"><span class="bd ${ok?'ok':'no'}">${ok?'✓':'✗'}</span><span><strong>${q.q}</strong><br>${detail}</span></div>`;
  }).join("");
  const breakdown = rows ? `<div class="breakdown">${rows}</div>` : `<p class="sub" style="margin-top:24px">You have not answered any tiles yet — head back and pick one.</p>`;
  const keepBtn = !allMapped ? `<button class="btn outline" data-act="keep">← Back to mapping</button>`:"";
  return `<section class="view"><div class="results">
      <div class="eyebrow" style="color:var(--crc-grey)">Your result</div>
      ${top}
      <div class="eyebrow" style="color:var(--crc-grey);margin-top:6px">Rank</div>
      <div class="rank">${rank}</div>
      <div class="big" id="bigScore">${S.displayScore}<small> / ${N}</small></div>
      <p class="msg">${msg}</p>
      <div class="sub">${S.score} of ${N} tiles mapped correctly</div>
      <div class="actions">
        ${keepBtn}
        <button class="btn" data-act="restart">Play again</button>
        <button class="btn outline" data-act="tab" data-v="deep">Open the Deep Dive</button>
      </div>
      ${breakdown}
    </div></section>`;
}

function viewCompare(){
  const pos=S.cmpPos;
  const active = S.obsActive ? obsBy(S.obsActive) : null;
  const wash = active ? `<div class="cmp-wash" style="background:${active.color}1f"></div>
       <div class="cmp-tag" style="background:${active.color}"><span class="d">Comparing — drag to look closely</span>${active.label}</div>` : "";

  // chips row
  const chips = OBS.map(o=>{
    const done = S.obsAns[o.key]!=null;
    const on = S.obsActive===o.key;
    return `<button class="chip-btn ${on?'on':''} ${done?'done':''}" data-act="openObs" data-v="${o.key}">${done?'✓ ':''}${o.label}</button>`;
  }).join("");

  // open observation question / reveal
  let obsPanel="";
  if(active){
    const chosen=S.obsAns[active.key];
    if(chosen==null){
      const opts=active.options.map((op,oi)=>`<button class="ss-opt" data-act="answerObs" data-k="${active.key}" data-v="${oi}">${op.t}</button>`).join("")
        + `<button class="ss-opt unsure" data-act="answerObs" data-k="${active.key}" data-v="-1">I'm not sure</button>`;
      obsPanel=`<div class="ss-q" style="border-left-color:${active.color}">
          <div class="ss-qh">${active.q}</div><div class="ss-opts">${opts}</div></div>`;
    } else {
      const opts=active.options.map((op,oi)=>{
        const cls = op.ok ? "rev-ok" : (oi===chosen ? "rev-no" : "rev-dim");
        return `<div class="ss-rev-opt ${cls}">${op.ok?'✓ ':(oi===chosen?'✕ ':'')}${op.t}</div>`;
      }).join("");
      obsPanel=`<div class="ss-reveal" style="border-left-color:${active.color}">
          <div class="rev-eye" style="color:${active.color}">Reveal · ${active.label}</div>
          <div class="ss-opts rev">${opts}</div>
          <p>${active.reveal}</p>
          <button class="btn outline sm" data-act="openObs" data-v="${active.key}">Close</button>
        </div>`;
    }
  }

  const n=obsCount();
  const progress = `<div class="ss-progress">${n} of ${OBS.length} layers probed${n>=3?' — claim unlocked below':''}</div>`;

  // claim step (unlocks after 3 observations)
  let claimBlock="";
  if(n>=3){
    if(!S.claimDone){
      const opts=CLAIM.options.map((op,oi)=>`<button class="ss-opt ${S.claimPick===oi?'picked':''}" data-act="claim" data-v="${oi}">${op.t}</button>`).join("");
      claimBlock=`<div class="ss-step">
        <div class="ghead">Make a claim</div>
        <div class="ss-q"><div class="ss-qh">${CLAIM.q}</div><div class="ss-opts">${opts}</div>
          ${S.claimHint?`<div class="ss-hint">${CLAIM.hint}</div>`:""}</div></div>`;
    } else {
      claimBlock=`<div class="ss-step">
        <div class="ghead">Your claim</div>
        <div class="ss-reveal" style="border-left-color:var(--crc-red)"><div class="rev-eye">Nice call</div><p>${CLAIM.reveal}</p></div></div>`;
    }
  }

  // three puzzle cards (after claim done)
  let puzzleBlock="";
  if(S.claimDone){
    const cards=PUZZLE.map((c,idx)=>{
      if(S.cards[c.key]){
        return `<div class="puz solved"><div class="puz-badge">${idx+1}</div>
            <div class="rev-eye">Reveal · ${c.reveal}</div>
            <div class="puz-t">${c.title}</div><p>${c.body}</p></div>`;
      }
      const hint = S.cardHint[c.key]!=null ? `<div class="ss-hint">${c.hint}</div>`:"";
      const opts=c.options.map((op,oi)=>`<button class="ss-opt" data-act="card" data-k="${c.key}" data-v="${oi}">${op.t}</button>`).join("");
      return `<div class="puz"><div class="puz-badge open">${idx+1}</div>
          <div class="puz-t">${c.title}</div><div class="puz-q">${c.q}</div>
          <div class="ss-opts">${opts}</div>${hint}</div>`;
    }).join("");
    const solved=PUZZLE.filter(c=>S.cards[c.key]).length;
    puzzleBlock=`<div class="ss-step">
      <div class="ghead">Solve the three mapping questions <span style="color:var(--crc-grey);text-transform:none;letter-spacing:0">${solved}/3 uncovered</span></div>
      <div class="puzzles">${cards}</div></div>`;
    if(solved===PUZZLE.length){
      puzzleBlock+=`<div class="ss-final">
        <div class="rev-eye" style="color:var(--crc-red)">You solved the open mapping puzzle</div>
        <p>OpenStreetMap and Google Maps aren't only two different maps — they're two different ways of <strong>organizing reality</strong>. One is strongest as an open, editable geographic database; the other as a navigation and place-search product. Humanitarian mapping depends on knowing the difference: what's visible, what's missing, what can be interpreted remotely, and what must be validated with local knowledge.</p>
        <button class="btn outline sm" data-act="resetSeesaw">Play the See-Saw again</button>
      </div>`;
    }
  }

  return `<section class="view seesaw">
    <p class="lead"><strong>Same town, two map logics.</strong></p>
    <p class="ss-intro">This is one corner of Squamish, British Columbia, shown in OpenStreetMap and Google Maps. Drag the handle to compare. Your task isn't to decide which one is “better” — it's to notice what each map chooses to make visible, what it simplifies, and what that says about how each tool represents reality.</p>
    <div class="fresh">
      <div class="c osm"><div class="k">OpenStreetMap</div><div class="d">Last updated July 15, 2025</div></div>
      <div class="c goo"><div class="k">Google Maps</div><div class="d">Last updated June 25, 2023</div></div>
    </div>
    <div class="slider" id="slider">
      <img src="assets/squamish-google.png" alt="Google Maps view of Squamish, British Columbia">
      <img id="osmLayer" src="assets/squamish-osm.png" alt="OpenStreetMap view of Squamish, British Columbia" style="clip-path:inset(0 ${100-pos}% 0 0)">
      <div class="lab l">OpenStreetMap</div><div class="lab r">Google Maps</div>
      ${wash}
      <div class="handle" id="cmpHandle" style="left:${pos}%"></div>
      <div class="knob" id="cmpKnob" style="left:${pos}%">↔</div>
      <input type="range" min="0" max="100" value="${pos}" id="cmpRange" aria-label="Drag to compare the two maps">
    </div>
    <div class="scaption">Map data: OpenStreetMap contributors and Google. The two captures are georeferenced to the same extent, so features line up as you drag.</div>

    <div class="ghead">Your mission — probe each layer</div>
    <p class="ss-mission">Move the slider slowly, then tap a chip to make an observation. Each one you probe uncovers a piece of the logic — exactly the way the planet appears tile by tile. A missing label doesn't always mean missing data.</p>
    <div class="chips">${chips}</div>
    ${obsPanel}
    ${progress}
    ${claimBlock}
    ${puzzleBlock}
  </section>`;
}

function accCard(it){
  const cls = it.type==="prompt" ? "prompt-c" : "explain-c";
  return `<details class="acc ${cls}"><summary><span class="tw">+</span><span>${it.q}</span></summary><div class="acc-body">${it.body}</div></details>`;
}
function viewDeep(){
  const groups=[]; let cur=null; const prompts=[];
  DEEP.forEach(it=>{
    if(it.group){ cur={title:it.group, items:[]}; groups.push(cur); return; }
    if(it.type==="prompt"){ prompts.push(it); return; }
    cur.items.push(it);
  });
  const groupHtml = groups.filter(g=>g.items.length).map(g=>
    `<div class="ghead">${g.title}</div>${g.items.map(accCard).join("")}`).join("");
  const promptHtml = prompts.length
    ? `<div class="ghead">Open prompts to sit with</div>
       <p class="lead" style="margin:-2px 0 12px;font-size:15px">No tidy answer here — these are questions to reflect on rather than resolve.</p>
       ${prompts.map(accCard).join("")}` : "";
  return `<section class="view">
    <p class="lead">The questions that do not have a tidy A, B, C, D answer. Open any card to expand. Explanations come first, with the open prompts gathered on their own at the end.</p>
    ${groupHtml}${promptHtml}
  </section>`;
}

function viewMM(){
  // 3D carousel ring: all member cards sit around one circle; spin with the
  // arrows, tap the front card to flip it and read a short description.
  const NM=MM_MEMBERS.length, cur=S.carIndex;
  const cards = MM_MEMBERS.map((m,i)=>{
    let d=((i-cur)%NM+NM)%NM; if(d>NM/2) d-=NM;     // signed distance from front
    const ad=Math.abs(d), front=ad===0, near=ad<=3;
    const op = front?1 : near ? (1-ad*0.24) : 0;
    const flipped = front && S.memFlip[i] ? "flipped" : "";
    return `<div class="ring-card ${front?'front':''} ${flipped}" style="--i:${i};opacity:${op.toFixed(2)};${near?'':'pointer-events:none;visibility:hidden'}" data-act="ringCard" data-v="${i}">
        <div class="disc-inner">
          <div class="disc-face front ${m.founder?'f':''}">${m.founder?'<span class="star">★</span>':''}<span class="nm">${m.name}</span></div>
          <div class="disc-face back"><span class="bk-desc">${m.desc}</span><a class="bk-link" href="${m.url}" target="_blank" rel="noopener noreferrer">Visit&nbsp;↗</a></div>
        </div>
      </div>`;
  }).join("");
  const ring = `<div class="ring3d">
      <button class="ring-btn prev" data-act="ringRot" data-dir="-1" aria-label="Previous">‹</button>
      <div class="ring-vp"><div class="ring-stage" style="--cur:${cur}">${cards}</div></div>
      <button class="ring-btn next" data-act="ringRot" data-dir="1" aria-label="Next">›</button>
    </div>
    <div class="ring-meta">${cur+1} / ${NM} · <strong>${MM_MEMBERS[cur].name}</strong> — tap the front card to flip it</div>`;

  const tools = MM_TOOLS.map(t=>
    `<a class="tool" href="${t.url}" target="_blank" rel="noopener noreferrer">
        <div class="ic">${svgIcon(t.key)}</div>
        <div style="min-width:0">
          <div class="role">${t.role}</div>
          <div class="nm">${t.name} <span class="ext">↗ visit site</span></div>
          <p>${t.desc}</p>
        </div>
      </a>`).join("");

  return `<section class="view">
    <p class="lead">Missing Maps is a coalition launched in <strong>November 2014</strong> by the American Red Cross, British Red Cross, Médecins Sans Frontières, and the Humanitarian OpenStreetMap Team. It has since grown to roughly twenty non-profit and academic members.</p>
    <div class="ghead">Member organizations <span style="color:var(--crc-red);text-transform:none;letter-spacing:0">★ = founding member · spin the ring</span></div>
    ${ring}
    <div class="ghead">The tooling stack <span style="color:var(--crc-grey);text-transform:none;letter-spacing:0">— tap a card to visit</span></div>
    <div id="toolList">${tools}</div>
  </section>`;
}

function viewGuide(){
  return `<section class="view guide">
    <h2>From Pixels to People</h2>
    <p class="glede">A remote sensing scientist's path into open, humanitarian, and disaster mapping — “how can I contribute meaningfully, and where do I begin?”</p>

    <p>You already know how to read an image, and that skill is rarer and more needed here than you would guess. So let me spare you the months of working out where you fit. I will tell you what to do, but more than that, how to think while you do it, because the second thing lasts longer than the first. Two truths first. Carry them everywhere.</p>

    <div class="truths">
      <div class="truth"><h4>Your skill is real, and it is the scarce one.</h4><p>This community is superb at producing map geometry through thousands of volunteers, and quietly weak at the thing you treat as routine: knowing how good the data is, and proving it. Many will trace a building. Almost no one will compute a confusion matrix on the result. You arrive already fluent in the missing discipline.</p></div>
      <div class="truth b"><h4>Your sight is partial, and that matters more.</h4><p>Your instruments see form: a roof, a road surface, the edge of a flood. They cannot see meaning: whether that roof shelters a clinic or a family, whether that road drowns every rainy season, who is inside and what they need. Nearly all the humanitarian value lives in that meaning layer, and you cannot reach it from orbit. Be excellent at form, and stand beside the people who hold the meaning — never imagine you replace them.</p></div>
    </div>

    <h3>Let me orient you</h3>
    <p>A few names recur. Learn them once and the rest reads easily.</p>
    <ul>
      <li><strong>OpenStreetMap (OSM)</strong> — the free, openly licensed, editable world map.</li>
      <li><strong>HOT (Humanitarian OpenStreetMap Team)</strong> — builds most of the humanitarian tooling on top of OSM.</li>
      <li><strong>Missing Maps</strong> — a coalition (Red Cross societies, MSF, HOT, universities) that maps vulnerable places before and during crises.</li>
      <li>A <strong>mapathon</strong> is an organized tracing event; a <strong>mapper</strong> traces, a <strong>validator</strong> checks a mapper's work. Validation is the more senior, more trusted role — and the one your eye is built for.</li>
    </ul>

    <div class="xref"><b>About the tools.</b> This guide names a working stack — OpenAerialMap, the Tasking Manager, fAIr, the drone tools, Field-TM, the Sketch Map Tool, ohsome. Rather than redefine them here, the <b>Missing Maps</b> tab already describes what each one does. This letter does something different: it shows where <em>your</em> skills plug into each. Think of that tab as the parts catalogue and this one as the wiring diagram.<br><button class="btn" data-act="tab" data-v="mm">Open the Missing Maps tab →</button></div>

    <h3>The path I would walk you down</h3>
    <p>Ordered from where you should start to where you can eventually lead. Resist skipping to the clever parts; the early steps earn you the right to be heard later.</p>

    <div class="gstep"><div class="num">Step 1 · Earn the eye</div><h3>First, map. Then validate.</h3>
      <p>Before you contribute a single image or model, spend a few hours as a mapper, then work toward validating — not as a rite of passage, but because you cannot judge the quality of work you have never done.</p>
      <ul><li>Open the HOT Tasking Manager, take a beginner project, and trace.</li><li>Do the built-in training and aim to become a validator. Validators are always scarce, and quality control is where your instincts pay off.</li><li>Try MapSwipe on your phone to feel how triage and AI-checking work.</li></ul>
      <p>Notice while you do it: roof outlines offset from footprints because of off-nadir imagery, basemaps that do not line up, shadows a tired volunteer mistakes for a structure. You will see these in seconds. That noticing is your first gift — and the moment you stop treating crowdsourced data as a black box.</p></div>

    <div class="gstep"><div class="num">Step 2 · Highest-leverage early move</div><h3>Give imagery.</h3>
      <p>Mappers can only trace what they can see, and good, current, well-registered imagery is the bottleneck. Preparing it is your home ground.</p>
      <ul><li>Upload openly licensed orthomosaics to OpenAerialMap. One careful upload can unblock an entire effort.</li><li>Apply the craft you already have: mosaicking, pan-sharpening, georeferencing, cloud handling, radiometric consistency across scenes. Careless imagery breeds careless maps.</li></ul>
      <div class="gnote">Feel the stakes of speed. After a disaster, the gap between imagery <em>existing</em> and being <em>usable</em> by mappers runs from hours to weeks, and people wait inside that gap. In your day job imagery is an input you consume; here it is an output others depend on, and releasing it openly multiplies its worth.</div></div>

    <div class="gstep"><div class="num">Step 3 · The contribution only you make well</div><h3>Bring accuracy assessment to a field hungry for it.</h3>
      <ul><li>Evaluate AI-generated or volunteer-traced features properly: confusion matrices, precision, recall, F1 for detections; IoU (Jaccard) and Dice for outlines.</li><li>Ground-truth a sample via field surveys (Field-TM) and report <em>fitness for purpose</em>, not a lone accuracy number. A map can be excellent for counting buildings and useless for property lines — a colleague deserves to know which.</li><li>Learn the community's quality language through ohsome and OQT: completeness, currentness, comparison against population grids. Speak their vocabulary and they will hear you.</li></ul>
      <p>Push, gently and persistently, to make “how accurate is this, and how do we know?” a normal question in humanitarian mapping, the way it is in remote sensing. Somewhere downstream a decision is being made on data whose quality no one measured.</p></div>

    <div class="gstep"><div class="num">Step 4 · If you do machine learning</div><h3>Build local, and build open.</h3>
      <ul><li>Global building-detection models ship as outputs, but their training data and code are usually closed, and they are biased toward the imagery they learned from. They fail on thatched roofs, dense informal settlements, walled compounds — the places that most need mapping.</li><li>The open answer is to fine-tune on local imagery and local building types. Studies in refugee settlements in Malawi and Kenya found global models stumbling on thatched roofs while a locally trained model coped. The gains are real but directional, so cite them as such.</li><li>In practice: use fAIr to fine-tune an open base model (RAMP is the standard) on ground you know, then publish your trained model openly.</li><li>Evaluate before you promote. Let suggestions reach mappers only if they clear a bar set in advance — say F1 above 0.8 on a held-out local area — and document the failure modes, not just the headline score.</li></ul>
      <div class="gnote">Two stances worth defending: open the model, not just the output, because a commons cannot trust what it cannot inspect. And AI suggests while humans decide — never bulk-import machine geometry. That design protects both the data and the agency of the people whose places are being drawn.</div></div>

    <div class="gstep"><div class="num">Step 5 · If you fly drones or do photogrammetry</div><h3>Plan, process, publish.</h3>
      <ul><li>Use the Drone Tasking Manager to plan multi-pilot coverage with low-cost drones, and OpenDroneMap to process flights into orthomosaics, elevation models, and point clouds.</li><li>Bring expertise to flight planning (ground sample distance, overlap), structure-from-motion quality, and harmonizing imagery from different operators.</li><li>Publish orthomosaics to OpenAerialMap, and keep the elevation byproducts for flood and risk modeling.</li></ul></div>

    <div class="gstep"><div class="num">Step 6 · When disaster comes</div><h3>This is where your field earns its keep.</h3>
      <p>Optical mapping fails exactly when it is most needed: under cloud, at night, mid-event. Your toolkit does not.</p>
      <ul><li><strong>SAR for floods.</strong> Sentinel-1 radar sees through cloud, day or night. A flood-extent map can show responders where the water is within hours, and decide where volunteers map first. State the limits too: radar struggles in cities (shadow, layover) and in mountains.</li><li><strong>Change detection for damage.</strong> Pair before/after imagery to flag destroyed or damaged buildings, which mappers then tag.</li><li><strong>Anticipatory action.</strong> Agencies increasingly act <em>before</em> a disaster, releasing funds against pre-agreed triggers. Your exposure layers (where people and buildings are) plus hazard forecasts feed those triggers — and OSM footprints are often the exposure baseline. Helping before the harm is some of the most meaningful work you can touch.</li></ul>
      <div class="gnote">The rhythm: an event happens, agencies define the affected area, open imagery is released, volunteers mobilize through the Tasking Manager, damage gets tagged, data flows to responders. You can add imagery, prioritization, or validation at any link in that chain.</div></div>

    <h3>The weight you are picking up</h3>
    <p>Putting people on a map helps responders reach them. It can also expose them. This is not a disclaimer to nod past; it has changed how serious organizations behave, and it should change how you do.</p>
    <div class="gwarn"><strong>Visibility can endanger.</strong> Mapping settlements, medical facilities, or the movements of vulnerable people can hand targeting information to the wrong hands. HOT suspended all mapping of Ukraine at the community's request over fears of military misuse, and restricts mapping in active conflicts to vetted contributors on private projects. Sometimes the most responsible map is the one you choose not to make.</div>
    <div class="gwarn"><strong>Openness sits in tension with control.</strong> OSM's strength is that everything is open and permanent — which collides with the principle that communities, especially Indigenous and at-risk groups, should control data about themselves. OSM has no “restricted” setting. This tension is not solved; treat it as live, and let it make you careful rather than cynical.</div>
    <div class="gwarn"><strong>The view from above is not neutral.</strong> The satellite gaze can reinforce the perspective of states and powerful actors over the people observed; watching from a distance still acts upon the watched. Carry that humility — it will make you better, not slower.</div>
    <p>A few rules to hold:</p>
    <ul><li>Before mapping anything touching conflict or persecuted populations, route it through HOT's Protection Framework and a do-no-harm assessment. Do not freelance this — bring it to people.</li><li>Where visibility could enable harm, default to aggregating or withholding detail.</li><li>Work <em>with</em> local mappers and communities, not over them. You supply the form; they own the meaning. That is the correct division of authority, not a courtesy.</li></ul>
    <p>And one thing for you, not the work: it is right to feel the weight of this. That feeling is your conscience doing its job. Do not let it tip into paralysis, or harden into detachment. The people who do this for a long time stay tender and rigorous at once.</p>

    <h3>Ways to matter that are not code or maps</h3>
    <ul><li><strong>Mentor and validate</strong> at mapathons. Your eye and standards make you a strong teacher — and teaching is how this knowledge survives you.</li><li><strong>Write the documentation the field is missing</strong> (the shared resource is LearnOSM). It lacks remote-sensing-grade method, metadata, and provenance habits.</li><li><strong>Peer-review open models and training data</strong> the way you would review a paper.</li><li><strong>Join the working groups</strong> — HOT's data-quality group, MapSwipe's volunteer governance. They shape how the whole system treats quality.</li><li><strong>Publish.</strong> Work on crowdsourced-vs-AI accuracy, OSM completeness, and the ethics of humanitarian remote sensing is read at the State of the Map academic track and in the ISCRAM crisis-informatics community. One landmark study found global urban OSM building completeness averaging only about 21% per urban center, with humanitarian mapping the main force closing the gap in the poorest regions.</li></ul>

    <h3>What I would have you do first</h3>
    <ul class="checklist">
      <li><strong>This week:</strong> make an account, trace a beginner Tasking Manager project, and try MapSwipe. Feel the workflow from the inside.</li>
      <li><strong>This month:</strong> work toward validator status; prepare and upload one well-registered, openly licensed imagery set to OpenAerialMap; run ohsome or OQT on an area you care about and write up its quality honestly.</li>
      <li><strong>This quarter:</strong> if you model, fine-tune and openly publish one localized fAIr model with a full evaluation and a frank list of failure modes. If you work in SAR or change detection, build one flood-extent or damage product that prioritizes where volunteers map, paired with explicit uncertainty.</li>
      <li><strong>Throughout:</strong> ask the accuracy question out loud, open your models and not just your outputs, never bulk-import machine geometry, and put local knowledge above the satellite view.</li>
    </ul>

    <h3>Where to plug in</h3>
    <ul><li><strong>Imagery:</strong> OpenAerialMap, plus the open archives you already know — Sentinel, Landsat, Maxar's Open Data program for disasters, Planet's NICFI tropical imagery.</li><li><strong>Code:</strong> HOT's GitHub hosts fAIr and its model repository, the drone and field tools, and the data tooling. The RAMP open building model lives on Radiant Earth's site.</li><li><strong>People:</strong> HOT runs public Slack channels for imagery coordination, machine learning, and the Tasking Manager, and welcomes newcomers. Do not stay a stranger — the point is for you to belong here, and in time to bring the next person in yourself.</li></ul>

    <div class="gnote"><strong>One honest word.</strong> Some newer features — parts of fAIr especially — sit on published roadmaps rather than being fully delivered, and several accuracy figures here come from single studies, not universal benchmarks. Check the current state of a tool before building on it, and cite specific numbers as the single studies they are. The direction is solid even where a date or statistic is provisional.</div>

    <p class="signoff">Begin small, stay rigorous, stay humane.</p>
  </section>`;
}

/* ===================================================================
   POST-RENDER (non-delegated listeners)
   =================================================================== */
function postRender(){
  const range=document.getElementById("cmpRange");
  if(range){
    const o=document.getElementById("osmLayer"), h=document.getElementById("cmpHandle"), k=document.getElementById("cmpKnob");
    range.oninput=e=>{
      S.cmpPos=+e.target.value;
      [o,h,k].forEach(el=>{ if(el) el.style.transition="none"; }); // instant while dragging
      if(o) o.style.clipPath=`inset(0 ${100-S.cmpPos}% 0 0)`;
      if(h) h.style.left=S.cmpPos+"%";
      if(k) k.style.left=S.cmpPos+"%";
    };
    // programmatic glide when a chip auto-reveals one side
    if(S.cmpTarget!=null){
      const t=S.cmpTarget; S.cmpTarget=null;
      requestAnimationFrame(()=>{
        S.cmpPos=t;
        if(o) o.style.clipPath=`inset(0 ${100-t}% 0 0)`;
        if(h) h.style.left=t+"%";
        if(k) k.style.left=t+"%";
        if(range) range.value=t;
      });
    }
  }
}

/* ===================================================================
   EVENT DELEGATION
   =================================================================== */
document.addEventListener("click", e=>{
  const el=e.target.closest("[data-act]");
  if(!el) return;
  const act=el.dataset.act, v=el.dataset.v;
  switch(act){
    case "tab": goTab(v); break;
    case "selTile": selectTile(+v); break;
    case "choose": choose(+v); break;
    case "back": backToMap(); break;
    case "retry": retryTile(); break;
    case "results": showResults(); break;
    case "keep": keepMapping(); break;
    case "restart": restart(); break;
    case "openObs": openObs(v); break;
    case "answerObs": answerObs(el.dataset.k, +v); break;
    case "claim": chooseClaim(+v); break;
    case "card": answerCard(el.dataset.k, +v); break;
    case "resetSeesaw": resetSeesaw(); break;
    case "ringRot": { const NM=MM_MEMBERS.length; S.carIndex=(S.carIndex+(+el.dataset.dir)+NM)%NM; render(); break; }
    case "ringCard": { const i=+v; if(i===S.carIndex){ S.memFlip[i]=!S.memFlip[i]; } else { S.memFlip[S.carIndex]=false; S.carIndex=i; } render(); break; }
    case "car": {
      const track=document.getElementById("car-"+el.dataset.car);
      if(track) track.scrollBy({left:(+el.dataset.dir)*Math.min(track.clientWidth*0.8, 440), behavior:"smooth"});
      break;
    }
  }
});

render();
</script>
