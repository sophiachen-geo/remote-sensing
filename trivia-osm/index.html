<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>The Open Mapping Playground — A Missing Maps Event Companion</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="description" content="A Canadian Red Cross companion to humanitarian open mapping: OpenStreetMap, remote sensing, and Missing Maps." />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --crc-white:#FFFFFF; --crc-red:#EE0000; --crc-red-dark:#D60000; --crc-red-tint:#FE9E86;
    --crc-black:#000000; --crc-black-tint:#474747; --crc-grey:#97999B; --crc-grey-tint:#AAADB1;
    --crc-grey-50:#F4F4F5; --crc-grey-100:#E4E4E5;
    --crc-brown:#653024; --crc-warm-grey:#746661; --crc-blue:#0085AD; --crc-blue-dark:#005670;
    --shadow-card:0 1px 3px rgba(0,0,0,.08),0 1px 2px rgba(0,0,0,.04);
    --shadow-raised:0 4px 12px rgba(0,0,0,.08);
    --shadow-overlay:0 8px 24px rgba(0,0,0,.12);
    --motion-ease:cubic-bezier(0.4,0,0.2,1);
    --font-sans:"Neue Haas Unica","Helvetica Neue",Arial,system-ui,sans-serif;
    --pad:24px; --maxw:1140px;
  }
  *,*::before,*::after{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;scroll-behavior:smooth}
  body{margin:0;font-family:var(--font-sans);font-size:16px;line-height:1.5;color:var(--crc-black);background:#fff}
  img{max-width:100%}
  button{font-family:inherit}
  @keyframes crcFade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

  .bar{background:#000;color:#fff}
  .bar-in{max-width:var(--maxw);margin:0 auto;padding:9px var(--pad);display:flex;align-items:center;justify-content:space-between;gap:16px}
  .bar-in img{height:28px;width:auto;display:block}
  .bar-in{gap:12px}
  .bar-left{display:flex;align-items:center;gap:14px;min-width:0}
  .bar-link{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:#fff;font-weight:600;text-decoration:none;border-bottom:2px solid transparent;white-space:nowrap;transition:color .15s var(--motion-ease),border-color .15s var(--motion-ease)}
  .bar-link:hover{color:var(--crc-red-tint);border-bottom-color:var(--crc-red-tint)}
  @media(max-width:560px){ .bar-link{font-size:10.5px;letter-spacing:.02em} .bar-in img{height:24px} }

  header.hero{max-width:var(--maxw);margin:0 auto;padding:48px var(--pad) 0}
  .eyebrow{font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--crc-red);margin-bottom:14px}
  .titlerow{display:flex;align-items:center;gap:18px;flex-wrap:wrap;margin-bottom:16px}
  .mm-logo{height:60px;width:auto;flex:none;display:block}
  header.hero h1{font-size:clamp(32px,6vw,56px);line-height:1.02;margin:0;max-width:18ch;font-weight:700;letter-spacing:-.02em}
  header.hero h1 .play{font-family:"Caveat","Segoe Script",cursive;font-weight:700;text-transform:uppercase;color:var(--crc-red);font-size:1.5em;line-height:.9;letter-spacing:.01em;display:inline-block;transform:rotate(-2deg)}
  header.hero p.tagline{font-family:"Caveat","Segoe Script",cursive;font-weight:700;font-size:clamp(22px,3.2vw,34px);line-height:1.05;color:var(--crc-black-tint);max-width:none;margin:10px 0 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  nav.tabs{max-width:var(--maxw);margin:28px auto 0;padding:0 var(--pad) 16px;border-bottom:1px solid var(--crc-grey-tint);display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  nav.tabs button{background:none;border:1.5px solid transparent;font:inherit;font-weight:600;font-size:15px;color:var(--crc-black);padding:9px 18px;cursor:pointer;border-radius:999px;white-space:nowrap;transition:all .15s var(--motion-ease)}
  nav.tabs button:hover{color:var(--crc-red);border-color:var(--crc-grey-tint)}
  nav.tabs button[aria-selected="true"]{background:var(--crc-red);color:#fff;border-color:var(--crc-red);font-weight:700}
  nav.tabs button[aria-selected="true"]:hover{color:#fff;background:var(--crc-red-dark);border-color:var(--crc-red-dark)}
  nav.tabs button.tab-right{margin-left:auto}

  main{max-width:var(--maxw);margin:0 auto;padding:32px var(--pad) 72px}
  section.view{animation:crcFade .35s var(--motion-ease)}
  .lead{font-size:18px;color:var(--crc-black-tint);max-width:64ch;margin:0 0 6px}

  .btn{display:inline-block;font:inherit;font-weight:700;font-size:15px;cursor:pointer;border-radius:4px;padding:11px 22px;border:1.5px solid var(--crc-red);background:var(--crc-red);color:#fff;transition:all .15s var(--motion-ease);text-decoration:none}
  .btn:hover{background:var(--crc-red-dark);border-color:var(--crc-red-dark)}
  .btn.outline{background:#fff;color:var(--crc-black);border-color:var(--crc-grey-tint)}
  .btn.outline:hover{border-color:var(--crc-red);color:var(--crc-red);background:#fff}
  .btn.ghost{background:none;border-color:transparent;color:var(--crc-grey);padding:0;font-size:14px}
  .btn.ghost:hover{color:var(--crc-red)}

  /* Challenge: tiles and question sit side by side on wide screens */
  .challenge{display:grid;grid-template-columns:minmax(0,1fr);gap:24px}
  @media(min-width:900px){
    .challenge{grid-template-columns:minmax(420px,500px) minmax(0,1fr);gap:36px;align-items:start}
    .ch-left{position:sticky;top:16px}
  }
  .ch-right{min-width:0}

  /* ---------- Challenge ---------- */
  .stats{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}
  .stat{flex:1;min-width:96px;border:1px solid var(--crc-grey-tint);border-radius:4px;padding:10px 14px}
  .stat .lbl{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--crc-grey);font-weight:700;margin-bottom:3px}
  .stat .val{font-size:24px;font-weight:700;line-height:1}
  .stat .val.red{color:var(--crc-red)}
  .stat .val.pop{transform:scale(1.2);transition:transform .2s var(--motion-ease)}
  .pbar{height:6px;background:var(--crc-grey-100);border-radius:999px;overflow:hidden;margin-bottom:20px}
  .pbar>i{display:block;height:100%;background:var(--crc-red);border-radius:999px;transition:width .4s var(--motion-ease)}

  .mapgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;max-width:520px;margin:0 auto 16px}
  .tile{position:relative;aspect-ratio:1;padding:0;border:0;border-radius:2px;cursor:pointer;overflow:hidden;background-color:#fff;background-image:url(assets/earth-globe.png);background-repeat:no-repeat;background-size:600% 600%;outline-offset:2px;transition:transform .15s var(--motion-ease)}
  .tile:hover{transform:scale(1.06)}
  .tile.sel{outline:3px solid var(--crc-black)}
  .tile .ov{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:clamp(12px,2.4vw,17px);color:#fff;transition:opacity .55s var(--motion-ease)}
  .tile.correct .ov{opacity:0}
  .rest-glyph{display:flex;flex-direction:column;align-items:center;gap:2px;opacity:.92}
  .rest-glyph span{font-size:9px;font-weight:700;letter-spacing:.04em}
  .mapcap{text-align:center;font-size:13px;margin:0 auto 22px;max-width:520px;color:var(--crc-grey)}
  .mapcap.done{color:var(--crc-red);font-weight:700}
  .legend{display:flex;gap:8px 14px;flex-wrap:wrap;align-items:center;justify-content:flex-start;margin:0 0 26px;max-width:560px}
  .legend span.it{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;color:var(--crc-black-tint);font-weight:500}
  .legend .dot{width:12px;height:12px;border-radius:2px;flex:none}

  .pathcard{background:#fff;border:1px dashed var(--crc-grey-tint);border-radius:4px;padding:34px 24px;text-align:center}
  .path-eyebrow{font-family:"Caveat","Segoe Script",cursive;font-weight:700;font-size:30px;line-height:1;color:var(--crc-red);margin-bottom:8px;transform:rotate(-1.5deg)}
  .pathcard p{font-size:17px;color:var(--crc-black-tint);max-width:48ch;margin:0 auto 4px;line-height:1.5}

  .qpanel{background:#fff;border:1px solid var(--crc-grey-tint);border-radius:4px;box-shadow:var(--shadow-card);padding:28px;animation:crcFade .3s var(--motion-ease)}
  .qhead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap}
  .chip{display:inline-flex;align-items:center;font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:#fff;padding:5px 12px;border-radius:3px}
  .qmeta{font-size:13px;color:var(--crc-grey);margin-bottom:8px}
  .qtext{font-size:clamp(20px,3vw,26px);line-height:1.3;font-weight:700;margin:0 0 20px;letter-spacing:-.01em}
  .opts{display:grid;gap:10px}
  .opt{display:flex;align-items:center;gap:14px;width:100%;background:#fff;border:1.5px solid var(--crc-grey-tint);border-radius:4px;padding:14px 16px;font:inherit;font-size:16px;color:var(--crc-black);cursor:pointer;transition:all .15s var(--motion-ease);text-align:left}
  .opt:not(:disabled):hover{border-color:var(--crc-red);background:var(--crc-grey-50)}
  .opt .key{flex:none;width:28px;height:28px;border-radius:4px;display:grid;place-items:center;font-weight:700;font-size:13px;background:var(--crc-grey-50);color:var(--crc-black-tint);border:1px solid var(--crc-grey-tint)}
  .opt .lab{flex:1}
  .opt .mark{margin-left:auto;font-weight:700;font-size:16px;color:var(--crc-grey)}
  .opt.wrong{background:var(--crc-grey-50);opacity:.6;cursor:default;pointer-events:none}
  .opt.wrong .key{background:var(--crc-grey);color:#fff;border-color:var(--crc-grey)}
  .opt.right{border-color:var(--crc-red);cursor:default;pointer-events:none}
  .opt.right .key{background:var(--crc-red);color:#fff;border-color:var(--crc-red)}
  .opt.right .mark{color:var(--crc-red)}
  .opt.dim{opacity:.5;cursor:default;pointer-events:none}
  .attempts{margin-top:14px;font-size:14px;font-weight:700;color:var(--crc-red)}
  .explain{margin-top:18px;border-left:3px solid var(--crc-red);background:var(--crc-grey-50);padding:14px 16px;border-radius:0 4px 4px 0;font-size:15px;line-height:1.55;color:var(--crc-black-tint);animation:crcFade .3s var(--motion-ease)}
  .explain b{color:var(--crc-black)}
  .qfoot{display:flex;justify-content:flex-end;margin-top:18px}

  .breakp{background:#000;color:#fff;border-radius:4px;padding:26px 22px;text-align:center;animation:crcFade .3s var(--motion-ease)}
  .breakp .eb{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--crc-red-tint)}
  .breakp .clock{font-size:46px;font-weight:700;line-height:1;margin:10px 0;font-variant-numeric:tabular-nums;color:var(--crc-grey)}
  .breakp .clock.on{color:#fff}
  .breakp p{font-size:15px;color:#fff;max-width:46ch;margin:0 auto 18px;line-height:1.55}
  .breakp .row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
  .breakp button{border-radius:4px;padding:11px 20px;font:inherit;font-weight:700;font-size:14px;cursor:pointer;border:0}
  .breakp .b-red{background:var(--crc-red);color:#fff}
  .breakp .b-red:hover{background:var(--crc-red-dark)}
  .breakp .b-wht{background:#fff;color:#000}
  .breakp .b-out{background:none;color:#fff;border:1.5px solid #fff}
  .breakp .lockline{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--crc-grey)}

  /* ---------- Results ---------- */
  .results{background:#fff;border:1px solid var(--crc-grey-tint);border-radius:4px;box-shadow:var(--shadow-card);padding:44px 28px;text-align:center;animation:crcFade .4s var(--motion-ease);max-width:720px;margin:0 auto}
  .results .globe{width:152px;height:152px;display:block;margin:16px auto 8px;animation:crcFade .5s var(--motion-ease)}
  .results .pin{width:84px;height:84px;border-radius:50%;background:var(--crc-red);display:flex;align-items:center;justify-content:center;margin:14px auto}
  .results .rank{font-size:28px;font-weight:700;margin:2px 0 0}
  .results .big{font-size:56px;font-weight:700;line-height:1;margin:18px 0 4px}
  .results .big small{font-size:24px;color:var(--crc-grey);font-weight:500}
  .results .msg{font-size:17px;color:var(--crc-black-tint);max-width:44ch;margin:8px auto 0}
  .results .sub{font-size:14px;color:var(--crc-grey);margin-top:8px}
  .results .actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:26px 0 4px}
  .breakdown{display:grid;gap:8px;text-align:left;max-width:640px;margin:28px auto 0}
  .brow{display:flex;gap:12px;align-items:flex-start;font-size:14px;padding:12px 14px;border-radius:4px;background:var(--crc-grey-50)}
  .brow .bd{flex:none;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:11px;font-weight:700;margin-top:1px}
  .brow .bd.ok{background:var(--crc-red)} .brow .bd.no{background:var(--crc-grey)}
  .brow strong{color:var(--crc-black)} .brow .ans{color:var(--crc-grey)} .brow .pending{color:var(--crc-blue-dark);font-weight:600}

  /* ---------- Compare ---------- */
  .fresh{display:flex;flex-wrap:wrap;gap:10px;margin:18px 0 16px}
  .fresh .c{flex:1;min-width:200px;border:1px solid var(--crc-grey-tint);border-radius:4px;padding:12px 16px}
  .fresh .c.osm{border-left:3px solid var(--crc-red)}
  .fresh .c .k{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
  .fresh .c.osm .k{color:var(--crc-red)} .fresh .c.goo .k{color:var(--crc-grey)}
  .fresh .c .d{font-size:16px;font-weight:700;margin-top:2px}
  .slider{position:relative;width:100%;aspect-ratio:1400/683;border:1px solid var(--crc-grey-tint);border-radius:4px;overflow:hidden;box-shadow:var(--shadow-card);user-select:none}
  .slider img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .slider .lab{position:absolute;top:12px;color:#fff;font-size:12px;font-weight:700;letter-spacing:.03em;padding:5px 10px;border-radius:4px;pointer-events:none}
  .slider .lab.l{left:12px;background:var(--crc-red)} .slider .lab.r{right:12px;background:#000}
  .slider .handle{position:absolute;top:0;bottom:0;width:2px;background:#fff;box-shadow:0 0 0 1px rgba(0,0,0,.28);pointer-events:none}
  .slider .knob{position:absolute;top:50%;width:36px;height:36px;border-radius:50%;background:#fff;box-shadow:var(--shadow-raised);transform:translate(-50%,-50%);display:flex;align-items:center;justify-content:center;pointer-events:none;color:var(--crc-black);font-weight:700;font-size:18px}
  .slider input[type=range]{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;cursor:ew-resize}
  .slider #osmLayer{transition:clip-path .55s var(--motion-ease)}
  .slider .handle,.slider .knob{transition:left .55s var(--motion-ease)}
  .slider .cmp-wash{position:absolute;inset:0;pointer-events:none;animation:crcFade .4s var(--motion-ease)}
  .slider .cmp-tag{position:absolute;left:50%;top:14px;transform:translateX(-50%);color:#fff;font-size:13px;font-weight:700;padding:7px 14px;border-radius:999px;pointer-events:none;box-shadow:var(--shadow-raised);text-align:center;animation:crcFade .4s var(--motion-ease);z-index:3}
  .slider .cmp-tag .d{display:block;font-size:10px;font-weight:600;letter-spacing:.04em;opacity:.92;text-transform:uppercase}
  .scaption{font-size:13px;color:var(--crc-grey);margin-top:8px}
  .ss-intro,.ss-mission{font-size:16px;color:var(--crc-black-tint);max-width:68ch;margin:0 0 12px}
  .ss-mission{margin-bottom:14px}
  /* observation chips */
  .chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
  .chip-btn{background:#fff;border:1.5px solid var(--crc-grey-tint);border-radius:999px;padding:8px 16px;font:inherit;font-weight:700;font-size:14px;cursor:pointer;transition:all .15s var(--motion-ease)}
  .chip-btn:hover{border-color:var(--crc-red);color:var(--crc-red)}
  .chip-btn.on{background:var(--crc-black);color:#fff;border-color:var(--crc-black)}
  .chip-btn.done{border-color:var(--crc-red);color:var(--crc-red)}
  .chip-btn.done.on{background:var(--crc-red);color:#fff}
  /* question + reveal */
  .ss-q,.ss-reveal{background:#fff;border:1px solid var(--crc-grey-tint);border-left:4px solid var(--crc-red);border-radius:0 4px 4px 0;padding:18px 20px;margin:0 0 6px;box-shadow:var(--shadow-card);animation:crcFade .3s var(--motion-ease)}
  .ss-qh{font-size:18px;font-weight:700;margin-bottom:12px}
  .ss-opts{display:grid;gap:9px}
  .ss-opt{text-align:left;background:#fff;border:1.5px solid var(--crc-grey-tint);border-radius:4px;padding:12px 15px;font:inherit;font-size:15px;color:var(--crc-black);cursor:pointer;transition:all .15s var(--motion-ease)}
  .ss-opt:hover{border-color:var(--crc-red);background:var(--crc-grey-50)}
  .ss-opt.unsure{color:var(--crc-grey);font-style:italic}
  .ss-opt.picked{border-color:var(--crc-red);background:var(--crc-grey-50)}
  .ss-rev-opt{padding:10px 14px;border-radius:4px;font-size:15px;border:1.5px solid transparent}
  .ss-rev-opt.rev-ok{border-color:var(--crc-red);color:var(--crc-black);font-weight:700;background:#fff}
  .ss-rev-opt.rev-no{color:var(--crc-grey);background:var(--crc-grey-50)}
  .ss-rev-opt.rev-dim{color:var(--crc-grey);opacity:.6}
  .ss-reveal .rev-eye{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--crc-red);margin-bottom:10px}
  .ss-reveal p{font-size:15px;color:var(--crc-black-tint);margin:12px 0 0;max-width:64ch}
  .ss-hint{margin-top:12px;border-left:3px solid var(--crc-grey-tint);background:var(--crc-grey-50);padding:10px 14px;font-size:14px;color:var(--crc-black-tint);border-radius:0 4px 4px 0}
  .ss-progress{font-size:13px;font-weight:700;color:var(--crc-grey);margin:10px 0 4px}
  .ss-step{margin-top:8px}
  .btn.sm{padding:8px 16px;font-size:14px;margin-top:14px}
  /* puzzle cards */
  .puzzles{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px}
  .puz{position:relative;background:#fff;border:1px solid var(--crc-grey-tint);border-top:3px solid var(--crc-grey-tint);border-radius:4px;padding:20px 20px 18px;box-shadow:var(--shadow-card)}
  .puz.solved{border-top-color:var(--crc-red);animation:crcFade .35s var(--motion-ease)}
  .puz-badge{width:26px;height:26px;border-radius:50%;background:var(--crc-grey);color:#fff;font-weight:700;font-size:13px;display:grid;place-items:center;margin-bottom:10px}
  .puz.solved .puz-badge,.puz-badge.open{background:var(--crc-red)}
  .puz-t{font-size:17px;font-weight:700;margin-bottom:6px}
  .puz-q{font-size:14.5px;color:var(--crc-black-tint);margin-bottom:12px}
  .puz .rev-eye{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--crc-red);margin-bottom:6px}
  .puz p{font-size:14.5px;color:var(--crc-black-tint);margin:0;max-width:none}
  .ss-final{background:var(--crc-grey-50);border:1px solid var(--crc-grey-tint);border-left:4px solid var(--crc-red);border-radius:0 4px 4px 0;padding:22px 24px;margin-top:18px;animation:crcFade .4s var(--motion-ease)}
  .ss-final .rev-eye{font-size:14px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;margin-bottom:10px}
  .ss-final p{font-size:16px;color:var(--crc-black-tint);max-width:68ch;margin:0}
  .ghead{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--crc-grey);margin:34px 0 12px}
  .seg{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap}
  .seg button{background:#fff;color:var(--crc-black);border:1.5px solid var(--crc-grey-tint);border-radius:4px;padding:9px 18px;font:inherit;font-weight:700;font-size:14px;cursor:pointer;transition:all .15s var(--motion-ease)}
  .seg button[aria-pressed="true"]{background:var(--crc-red);color:#fff;border-color:var(--crc-red)}
  .cards2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
  .icard{background:#fff;border:1px solid var(--crc-grey-tint);border-radius:4px;padding:20px 22px;box-shadow:var(--shadow-card)}
  .icard .k{font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;margin-bottom:12px}
  .icard.s .k{color:var(--crc-red)} .icard.w .k{color:var(--crc-grey)}

<script>
/* ===================================================================
   DATA
   =================================================================== */
const QUESTIONS = [
  { cat:"Missing Maps / HOT", q:"In what year was the Missing Maps project founded?", options:["2010","2014","2016","2009"], answer:1, explain:"<b>2014.</b> Launched November 2014 by the American Red Cross, British Red Cross, MSF, and the Humanitarian OpenStreetMap Team (HOT)." },
  { cat:"Missing Maps / HOT", q:"The Humanitarian OpenStreetMap Team was galvanized by the volunteer mapping response to which 2010 disaster?", options:["Pakistan floods","Haiti earthquake","Eyjafjallajökull eruption","Deepwater Horizon spill"], answer:1, explain:"<b>The Haiti earthquake.</b> After the January 2010 quake, OSM volunteers turned a near-blank Port-au-Prince into the most detailed map available within weeks. All four are real 2010 events, so it reads as a fair which-one." },
  { cat:"OSM History", q:"OpenStreetMap was founded in what year, largely because national map data was locked behind licensing fees?", options:["2004","2009","1999","2012"], answer:0, explain:"<b>2004.</b> Steve Coast started OSM in 2004 in the UK, reacting to Ordnance Survey paywalls." },
  { cat:"OSM Licensing", q:"All OpenStreetMap data is released under which licence, keeping it free and share-alike forever?", options:["MIT License","Creative Commons CC-BY","Open Database License (ODbL)","Mapyright Eternal"], answer:2, explain:"<b>ODbL.</b> Use the data freely, but improvements stay open. The fourth option is the joke. <br><br>Follow-up: whose imagery is this, anyway? Most high-res commercial imagery is licensed to OSM contributors under specific tracing agreements (Maxar, Esri, Bing). The pixel remains proprietary; only the vector you trace becomes open. That structural compromise is what makes Missing Maps possible." },
  { cat:"Flood / Disaster (Canada)", q:"What is the costliest flood in Canadian history by insured losses, and at the time the costliest natural disaster of any kind?", options:["2011 Richelieu River flood, QC","2013 Southern Alberta floods","2017 Quebec spring floods","2019 Ottawa River flood"], answer:1, explain:"<b>The 2013 Southern Alberta floods.</b> June 2013, more than 1.7 billion dollars in insured damage, the costliest natural disaster in Canadian history at the time. Source: Insurance Bureau of Canada." },
  { cat:"Remote Sensing", q:"Which satellite sensor can map flood extent at night and straight through storm clouds, making it a disaster-response workhorse?", options:["Optical / multispectral (Landsat-style)","Synthetic Aperture Radar (SAR, e.g. Sentinel-1)","Thermal-only camera","A really good telescope"], answer:1, explain:"<b>Synthetic Aperture Radar (SAR).</b> SAR is active radar: its own microwave pulses pass through cloud and need no daylight, so it images floods mid-storm when optical sensors see only white. The bridge from remote sensing to why we mapathon." },
  { cat:"Flood / Disaster (Canada)", q:"Roughly how many people were forced from their homes by the 2013 southern Alberta floods?", options:["10,000","100,000","500,000","25,000"], answer:1, explain:"<b>100,000.</b> Four people died and 100,000 were forced from their homes. The trap is 25,000, which was the number of insurance claims, not evacuees." },
  { cat:"Imagery Alignment", q:"Which reference became a de-facto standard for aligning paths in OSM editors, outperforming single GPS traces because aggregation averages out individual GPS error?", options:["Google Street View","Strava Global Heatmap","Apple Look Around","A single survey-grade GPS fix"], answer:1, explain:"<b>The Strava Global Heatmap.</b> Aggregation across about a billion uploads averages out individual GPS multipath and constellation error, and it is immune to relief displacement because it is not orthorectified imagery. <br><br>Blind spot for humanitarian work: coverage follows athletic activity, concentrated in OECD urban and recreational areas. In the Sahel, conflict zones, or remote rural Asia, the heatmap is empty and you are back to GPS traces or the Imagery Offset Database." },
  { cat:"Imagery Alignment", q:"A Sentinel-2 tile over mountains shows plus-or-minus 10 m horizontal displacement across 99.8 per cent of its pixels. What is the dominant physical cause?", options:["Atmospheric refraction at the sensor","DEM vertical error propagated through the imaging geometry","Earth's rotation during capture","Camera lens distortion"], answer:1, explain:"<b>DEM vertical error propagated through orthorectification geometry.</b> Lateral offset is roughly vertical error times tan(view angle). ESA's L1C orthorectification historically used PlanetDEM 90 (recent baselines moved toward Copernicus DEM); a stale or wrong DEM over mining, landslides, or glaciers shifts the offset. Each provider's DEM choice adds a different, partly independent bias on top of pointing and ephemeris residuals, which is why your imagery layers disagree." },
  { cat:"OSM History", q:"Who started OpenStreetMap in 2004?", options:["Steve Coast","Mikel Maron","Linus Torvalds","Marie Curie"], answer:0, explain:"<b>Steve Coast.</b> He started the project in the United Kingdom in 2004." },
  { cat:"OSM Basics", q:"Which of these is NOT one of OpenStreetMap's data building blocks?", options:["Node","Way","Relation","Pixel"], answer:3, explain:"<b>Pixel.</b> OSM is vector data: nodes, ways, and relations. Pixels belong to imagery, not the map." },
  { cat:"Tools", q:"Which tool splits a project area into a grid and locks each square to one mapper?", options:["iD Editor","HOT Tasking Manager","MapSwipe","Mapillary"], answer:1, explain:"<b>The HOT Tasking Manager.</b> It hands each volunteer a square so hundreds map the same area without colliding." },
  { cat:"Tools", q:"In which app do volunteers swipe through satellite tiles to flag where buildings exist?", options:["MapSwipe","JOSM","Field Papers","OSMCha"], answer:0, explain:"<b>MapSwipe.</b> Swiping points detailed tracing at the right places." },
  { cat:"Tools", q:"What is the default in-browser editor that most mapathon tracing uses?", options:["JOSM","iD","Photoshop","ArcGIS"], answer:1, explain:"<b>iD.</b> It has a low barrier to entry and runs in the browser." },
  { cat:"Tools", q:"Which powerful desktop editor is recommended for validation?", options:["JOSM","iD","MapSwipe","Bing"], answer:0, explain:"<b>JOSM.</b> A desktop editor with plugins and data-quality tools." },
  { cat:"AI and Mapping", q:"What is the guiding principle of HOT's fAIr mapping service?", options:["AI maps everything automatically","AI suggests, a human decides","Humans are replaced by AI","No AI is ever used"], answer:1, explain:"<b>AI suggests, a human decides.</b> Bulk machine import is still off limits." },
  { cat:"Tools", q:"Which workflow means print an atlas, walk it, annotate by hand, then photograph it?", options:["Field Papers","Street View","Tasking Manager","Strava"], answer:0, explain:"<b>Field Papers.</b> It captures local detail that satellite imagery cannot show." },
  { cat:"Tools", q:"Which street-level photo layer helps read signs and building names?", options:["Mapillary","Landsat","Sentinel-1","ODbL"], answer:0, explain:"<b>Mapillary.</b> Crowdsourced street-level photos, viewable inside iD and JOSM." },
  { cat:"Tagging", q:"How are OpenStreetMap tags structured?", options:["key=value pairs","full sentences","secret codes","colour swatches"], answer:0, explain:"<b>key=value pairs.</b> Simple pairs like building=yes describe every feature." },
  { cat:"Tagging", q:"What does the any tags you like principle mean?", options:["every tag must be approved first","the database never checks whether tags mean anything","only experts can add tags","tags cost money"], answer:1, explain:"<b>The database never checks meaning.</b> Norms emerge from how often a tag gets used, not from a vote." },
  { cat:"Tagging", q:"What does the admin_level tag describe?", options:["administrative boundaries","road surface","building height","tree species"], answer:0, explain:"<b>Administrative boundaries.</b> The levels get remapped country by country." },
  { cat:"Tagging", q:"Why does highway=primary cause cross-border confusion?", options:["it is banned in most countries","it means a different kind of road in different countries","it only works offline","it changes colour"], answer:1, explain:"<b>It means a different road in different countries.</b> The ladder was built around one country's network." },
  { cat:"Remote Sensing", q:"In what year did the USGS open the full Landsat archive for free?", options:["1972","2008","2020","1999"], answer:1, explain:"<b>2008.</b> Free access did more for global remote sensing than any single satellite." },
  { cat:"Remote Sensing", q:"What does SAR stand for?", options:["Synthetic Aperture Radar","Satellite Aerial Reconnaissance","Standard Atmospheric Reading","Spatial Analysis Routine"], answer:0, explain:"<b>Synthetic Aperture Radar.</b> Active radar that sees through cloud and works at night." },
  { cat:"Red Cross", q:"The Red Cross emblem is protected under which of these?", options:["the Geneva Conventions","copyright law only","a trademark registry","no rules at all"], answer:0, explain:"<b>The Geneva Conventions.</b> Treat the emblem as a regulated symbol, not a logo." },
  { cat:"Missing Maps / HOT", q:"Which of these is NOT a founding member of Missing Maps?", options:["American Red Cross","British Red Cross","Médecins Sans Frontières","Google"], answer:3, explain:"<b>Google.</b> The founders were the American and British Red Cross, MSF, and HOT." },
  { cat:"Red Cross", q:"The Canadian Red Cross is part of which global movement?", options:["International Red Cross and Red Crescent Movement","the United Nations","the World Bank","NATO"], answer:0, explain:"<b>The International Red Cross and Red Crescent Movement.</b>" },
  { cat:"Imagery", q:"Most high-resolution imagery is licensed to OSM tracers from providers such as which?", options:["Maxar, Bing, and Esri","only government agencies","social media sites","nobody, it is all public domain"], answer:0, explain:"<b>Maxar, Bing, and Esri.</b> The pixels stay proprietary; only the vector you trace becomes open." },
  { cat:"Imagery Alignment", q:"Why does a mapathon ask everyone to use one imagery layer?", options:["to save bandwidth","so the alignment offset stays consistent","to make it look nicer","to slow mappers down"], answer:1, explain:"<b>So the offset stays consistent.</b> The data may be systematically shifted, but at least it agrees with itself." },
  { cat:"Flood / Disaster (Canada)", q:"Which Canadian province has the highest historical average annual insured loss due to flooding, and has experienced the most catastrophic flooding events in the past decade?", options:["Ontario","Alberta","Quebec","British Columbia"], answer:2, explain:"<b>Quebec.</b> Per the Insurance Bureau of Canada and Natural Resources Canada, Quebec carries the highest historical average annual insured flood losses and has seen repeated catastrophic flooding, including the widespread spring floods of 2017 and 2019." },
  { cat:"Flood / Disaster (Canada)", q:"Which of these major cities is NOT located in a high-risk area for flooding?", options:["Edmonton, AB","Montreal, QC","Fredericton, NB","Regina, SK"], answer:3, explain:"<b>Regina, SK.</b> It sits on flat prairie away from a major river floodplain — unlike Edmonton (North Saskatchewan River), Montreal (St. Lawrence, spring freshet), and Fredericton (Saint John River, repeat flooding). The cheeky presenter's aside, of course, is that nowhere is truly flood-proof." },

const DEEP = [
  { group:"Imagery and Provenance" },
  { type:"explain", q:"Where does Esri's World Imagery Clarity (used in this project) come from?",
    body:`<p>A mosaic stitched from commercial providers (Maxar Vivid, Airbus), national programs (USDA NAIP, provincial and state aerial), and Esri's Community Maps contributor pipeline.</p>
    <p>The Clarity layer is reprocessed for color balance, atmospheric correction, and sharpening <strong>optimized for visual interpretation</strong> (that is, tracing), not radiometric analysis. Imagery is typically 2 to 4 years old. The design priority is visual consistency across tiles, not recency.</p>` },
  { type:"explain", q:"Why does the imagery shift when you zoom in or out on the same tile sometimes?",
    body:`<p>Tile pyramids stack pre-rendered tiles per zoom level, and different zooms pull from different source layers:</p>
    <ul><li><strong>Low zoom (z5 to z10):</strong> downsampled Landsat / Sentinel mosaics or coarse commercial composites</li>
    <li><strong>Mid zoom (z11 to z15):</strong> NAIP, Airbus, Maxar Vivid mosaics</li>
    <li><strong>High zoom (z16 to z19):</strong> sub-meter WorldView, Pléiades, sometimes aerial orthophotos</li></ul>
    <p>Each layer is captured on different dates by different sensors at different sun angles and off-nadir geometries. A house built in 2022 may appear at z18 (recent commercial) and vanish at z13 (older mosaic). The visual morphing you see while zooming is <strong>provenance leaking through the seams.</strong></p>` },
  { type:"prompt", q:"In open mapping, how do you reconcile imagery vintages when sources disagree?",
    body:`<p class="ponder"><em>Open prompt.</em> When two layers show different realities, which do you trust: the sharpest, the most recent, or the one that matches ground truth? There is no single right answer; it is a judgement call every mapper makes.</p>` },
  { type:"prompt", q:"When did Landsat become free, and why does it matter?",
    body:`<p class="ponder"><em>Open prompt.</em> A hint to chase: the USGS opened the full Landsat archive at no cost in 2008, a policy shift that arguably did more for global remote sensing than any single satellite. Why would free change the science so much?</p>` },
  { type:"prompt", q:"The 2012 Apple Maps disaster: what did it expose?",
    body:`<p class="ponder"><em>Open prompt.</em> Think about what happens when a single company replaces a mature, crowd-checked dataset overnight: melted bridges, misplaced towns, vanished cities. What does it say about the value of ground-truth and incremental correction?</p>` },
  { type:"explain", q:"Why can a complete map of a settlement still be incomplete?",
    body:`<p>Mapathons trace what is visible from nadir. Informal extensions, indoor structures, seasonal dwellings, sacred sites, contested boundaries, and tree-canopy-obscured features are systematically invisible.</p>
    <p>Mapping is also <strong>ontological</strong>: what counts as building, road, or place is a tagging decision, not an objective fact.</p>` },

  { group:"How tagging actually works" },
  { type:"explain", q:"How did OSM's tagging rules even come about? Who decided what counts as a valid tag?",
    body:`<p>Nobody did, and that is the whole trick. OSM was built on a principle called <strong>any tags you like.</strong> Tags are just <code>key=value</code> pairs, and the database never checks whether any of them mean anything. So the rules were never legislated, they emerged, and they live in three places with wildly different amounts of real power.</p>
    <p><strong>The wiki</strong> is the official documentation, with a proposal-and-vote process. Sounds authoritative. It mostly is not: approval is non-binding, and the wiki itself admits the map is not the documentation.</p>
    <p><strong>taginfo</strong> is just statistics on how often each tag gets used. This is what decides what is real: a tag is legitimate if a lot of people use it. Frequency hardens into a norm because everyone copies what is already common.</p>
    <p><strong>Editor presets</strong>, the menus inside iD and JOSM, are where governance quietly bites hardest. Whatever the default editor puts in front of a newcomer is what they will tag, so preset maintainers shape the schema far more than any vote does.</p>
    <div class="takeaway"><strong>One-line takeaway:</strong> real authority drifted away from the voting layer into the infrastructure, presets plus usage stats. The proposal process is mostly ceremony now, and the schema is deeply path-dependent. The whole <code>highway</code> hierarchy was inherited from British road categories and now governs roads worldwide, not because it fits, but because it got there first and landed in the editor.</div>` },
  { type:"explain", q:"Can anyone just make up a new tag? And what if you want to change one that already exists?",
    body:`<p>You can absolutely invent one. Two ways: run the formal proposal and collect your handful of votes, or just start tagging things with it. If it catches on in taginfo and someone slots it into a preset, congratulations, it is part of the schema.</p>
    <p>Changing or retiring an existing tag is a completely different story, and that <strong>asymmetry</strong> is the important bit. Adding is cheap. Changing things at scale sets off alarms: mass edits fall under the automated edits code of conduct, and undiscussed systematic edits get treated as vandalism if they persist, partly because careless bulk edits can be impossible to roll back and create repair work for everyone else.</p>
    <div class="takeaway">So the system keeps adding and almost never cleans up. Dead and deprecated tags pile up in a long tail. It is technical debt at the level of the vocabulary itself: there is no garbage collection for meaning.</div>` },
  { type:"explain", q:"Why does tagging look so different from one country to the next? Is that a feature or a bug?",
    body:`<p>Both, and the reason is unavoidable: tags point at real things in the world, and those things mean different things in different places. The schema looks universal on the surface while being totally local underneath.</p>
    <p><strong>Roads:</strong> the <code>highway</code> ladder (motorway, trunk, primary) was designed around one country's network, so everyone else wrote a rulebook translating their road classes onto it. <code>highway=primary</code> means a meaningfully different road in Germany versus the US versus India.</p>
    <p><strong>Boundaries:</strong> <code>admin_level</code> runs 1 to 11 but gets remapped country by country. Level 4 is a US state, a German Land, a region elsewhere. There are literally per-country lookup tables on the wiki.</p>
    <p><strong>Addresses:</strong> the address tags assume Western street-and-number logic, so block-based addressing (e.g. Japan) fits awkwardly.</p>
    <ul><li><strong>Good side:</strong> fidelity. You are not forcing a foreign category onto a place, and communities encode distinctions that matter to them.</li>
    <li><strong>Bad side:</strong> broken global interoperability. Routers and cross-border analysis need per-country logic. A tax on every data consumer: know the local convention or get it wrong.</li></ul>
    <div class="takeaway">OSM pretends to be one global database while really being a federation of local mapping cultures. Universal on the surface, patchwork in fact, and whoever uses the data across borders pays for the gap.</div>` },

  { group:"Imagery alignment and offsets" },
  { type:"explain", q:"Why do correctly orthorectified imagery layers still disagree by several metres?",
    body:`<p>Three primary physical sources, plus two often-missed ones:</p>
    <ul><li><strong>1. DEM error through orthorectification geometry</strong> (the dominant contributor). Lateral offset is roughly DEM vertical error times tan(view angle). A 2018 study found 99.8 per cent of Sentinel-2 pixels over Austria showed plus-or-minus 10 m (one pixel) displacement from PlanetDEM inaccuracies in ESA's L1C processing. A stale DEM over mining, landslides, or glacier movement shifts the offset further.</li>
    <li><strong>2. Sensor pointing and platform ephemeris uncertainty.</strong> Each provider calibrates differently (Maxar GCPs plus Vivid pre-mosaicking, Sentinel-2 GRI registration, NAIP aerotriangulation). Residual pointing errors are uncorrelated across providers, so two correct tiles disagree.</li>
    <li><strong>3. Off-nadir geometry plus relief displacement.</strong> WorldView routinely collects 15 to 30 degrees off-nadir. Even with perfect DEM and pointing, a building's rooftop projects to different positions from different orbit passes, both correctly orthorectified against bare earth.</li></ul>
    <p>Often-missed: <strong>geoid model differences</strong> (EGM96 versus EGM2008 versus national geoids) add sub-metre vertical reference shifts; and <strong>atmospheric refraction at low sun angles</strong> distorts geometry at high latitudes (a recurring Nordic complaint).</p>` },
  { type:"explain", q:"What five overlapping solutions has the community built to fix alignment?",
    body:`<ul><li><strong>1. GPS traces (since 2006):</strong> the canonical ground reference. In JOSM, hide the data layer, add a new offset, drag imagery until traces follow roads. Single traces are noisy, so use many across the same road to find the mean.</li>
    <li><strong>2. Imagery Offset Database / IODB (Zverev, 2013):</strong> centralized offset bookmarks plus a JOSM plugin. Flags you to check existing offsets and apply them in one step. Unresolved problem: it requires consciously checking before working, and is JOSM-only, while iD now dominates by edit volume.</li>
    <li><strong>3. Strava Global Heatmap:</strong> current de-facto standard for paths. Averaged across about a billion uploads, immune to relief displacement, sees paths under tree cover. OSM has permission (reconfirmed Nov 2019) to trace from it. Blind spot: coverage follows recreational activity.</li>
    <li><strong>4. Mapillary and KartaView:</strong> street-level ground truth, integrated into iD and JOSM. Great for what is there (bus-stop names, building names), but imprecise geo-referencing means they need map-matching (5 m GPS tolerance, 10 to 30 m buffers): ground truth for what, not always exactly where.</li>
    <li><strong>5. iD fix alignment plus Tasking Manager imagery lock:</strong> iD does not store offsets between sessions, so every newcomer starts unaligned. The HOT workaround: mandate one imagery layer per project so the offset is systematically consistent, even if not absolutely correct.</li></ul>
    <div class="takeaway">A structural inversion: with Strava covering 55 per cent or more of OSM ways, the alignment reference is now richer than the data being aligned.</div>` },
  { type:"explain", q:"What actually happens to alignment in a humanitarian mapathon?",
    body:`<p>The five-layer reality stack:</p>
    <ul><li>Project manager picks Maxar Vivid or Bing as the mandatory layer.</li>
    <li>Mappers in iD trace without aligning (most do not know they can).</li>
    <li>Validators in JOSM may align using GPS traces, Strava, or IODB if a regional contributor seeded it.</li>
    <li>Field teams ground-truth a sample with handheld GPS or smartphone (Field Papers, KoboCollect).</li>
    <li>Long after, local mappers re-align using accumulated GPS traces and quietly move thousands of features 3 to 8 m.</li></ul>
    <div class="takeaway">The result is <strong>systematically biased, internally consistent, and accurate enough for response coordination.</strong> Fine for routing, navigation, and admin-scale exposure modeling. Never use OSM directly for cadastral, infrastructure engineering, or legal property boundaries.</div>` },

  { group:"Power, culture and the future" },
  { type:"explain", q:"Is the tagging system culturally neutral? Because it feels like it might be smuggling in assumptions.",
    body:`<p>It is not neutral, and the fact that it looks neutral is the real problem. Four tangled things:</p>
    <p><strong>1. The vocabulary carries a worldview.</strong> Tags lean on Global North categories. A generic <code>place_of_worship</code> plus religion subtag flattens everything outside the big traditions; land-use and ownership tags assume private, surveyed, cadastral property, so communal, customary, or Indigenous tenure fits badly. The schema has an ontology baked in, the decolonial-cartography critique.</p>
    <p><strong>2. Place names and contested territory.</strong> OSM uses multilingual name tags plus an on-the-ground rule: use the name people actually use locally. Smart, but imperfect. Crimea, the India-China border, Israel and Palestine, colonial versus Indigenous names keep flaring. A Data Working Group referees the worst of it.</p>
    <p><strong>3. Indigenous data sovereignty (structural, not fixable).</strong> OSM is one global namespace that openly replicates everywhere. It cannot encode restricted to community members, seasonal, or sacred, not public. CARE principles and TK Labels assume you can control access; ODbL plus open replication assume you cannot.</p>
    <p><strong>4. Who maps whom.</strong> When remote volunteers map the Global South off satellite imagery, you get maps very legible to outsiders (footprints, logistics roads) and not to residents (the informal economy, meaning, seasonal use).</p>
    <div class="takeaway">Deciding the map should be one open namespace with a permanent public record, built on enumeration and private-property defaults, is not a neutral technical choice. It is a specific way of seeing the world, presented as just how maps work.</div>` },
  { type:"explain", q:"Where is OSM headed in the age of AI? Is AI good or bad for it as a data source?",
    body:`<p>Mostly it intensifies a pressure that was already there: <strong>centralization.</strong></p>
    <p>The cautionary tale is <strong>Meta</strong> pushing computer-vision data into Egypt without following import rules, quality bad enough that the whole thing got reverted. That failure is a big reason import policies are strict.</p>
    <p>The deliberate opposite is HOT's <strong>fAIr</strong>: a free, open-source AI service letting local communities build their own localized models. It runs on open imagery from OpenAerialMap, will not dump mass features into the map, and mapper corrections feed back to sharpen the model. One pilot pulled 18 million building footprints across Tanzania and Uganda and nearly doubled a mapper's daily output. The settled principle: <strong>AI suggests, a human decides.</strong> Bulk machine import is still taboo.</p>
    <p>A quieter use may matter more long-term: <strong>AI for quality control.</strong> Neural models now read changesets and flag suspicious ones. As editing outpaces human reviewers, the trust system leans on those models, handing a quiet authority to whoever runs them (tending to be the same big companies).</p>
    <div class="takeaway">The worry: AI is great at the boring, uniform, satellite-visible stuff (buildings, roads) and bad at OSM's real value, the local, ground-checked, meaningful detail. The risk is AI hollows OSM toward its most automatable layer while the real value gets captured downstream.</div>` },
  { type:"explain", q:"I keep hearing about Overture Maps. What is it, and is it a threat to OSM?",
    body:`<p>The live drama right now. <strong>Overture</strong> is a foundation backed by Meta, Amazon, Microsoft, and TomTom (with Esri now steering too). It takes open data and builds a clean, standardized, quality-controlled product for big enterprise and spatial-AI customers. Key fact: roughly <strong>40 per cent of Overture comes straight from OSM</strong>, it sits downstream of the volunteer project.</p>
    <p>The fight blew up over <strong>GERS</strong>, a system of permanent unique IDs for real-world things. In early 2026 it went to the OGC for adoption as an official standard, and much of the OSM community pushed back, warning of corporate enclosure: a pay-to-play membership around 300,000 dollars, opaque governance, a 20 per cent rate of IDs churning, and fear it could render volunteer mapping obsolete (the critics' framing).</p>
    <p>Not a clean villain story, though. Overture also joined OpenStreetMap US as a strategic member and funds community tooling like MapRoulette. More parasite-meets-patron than pure enemy.</p>
    <div class="takeaway">The fight is not really about the data, Overture needs OSM's data. It is trying to own the layer above the data: the permanent ID system that makes stitching datasets together cheap. That conflation step is where the commercial value piles up. Enclosure by owning the abstraction layer. And as LLMs become how people query maps, there will be pressure to standardize tags toward whatever the models parse cleanly, one more force against local variety.</div>` },
  { type:"explain", q:"How does mixing remote sensing with OSM play out differently when it is specifically for humanitarian work?",
    body:`<p>This is where it gets ethically interesting. They are fundamentally different ways of knowing, and the humanitarian setting cranks up every difference.</p>
    <ul><li><strong>Remote sensing</strong> looks down from above: repeatable, scalable, impartial, capturing physical form (roofs, road surfaces, flood extent, vegetation). Blind to function, ownership, meaning, use.</li>
    <li><strong>OSM</strong> at its best is the opposite: ground-checked, attribute-rich, semantically tagged, locally meaningful, but patchy, depending entirely on who showed up to map.</li>
    <li>The <strong>humanitarian workflow</strong> (HOT, Missing Maps) fuses them: imagery is what you trace over, OSM is the meaningful product. fAIr just automates the first step.</li></ul>
    <p><strong>Detecting is not understanding.</strong> The fusion counts buildings and roads fast, great for responder logistics, but that is the responder's view, not the resident's (who owns what, where informal services are, how risk feels).</p>
    <p><strong>A cruel timing problem.</strong> Crisis mapping is fastest off imagery exactly when ground-checking is hardest, during an active disaster. So the satellite-derived map is most authoritative when it is least verified.</p>
    <p><strong>Visibility cuts both ways.</strong> Mapping an informal settlement, refugee camp, or conflict zone makes people visible to aid, and to states, militaries, and whoever wants to evict them. Remote sensing makes you visible without consent; OSM makes you visible permanently, publicly, openly, with no restricted setting. The do-no-harm problem at the center of it all.</p>
    <div class="takeaway">Uniquely powerful (fast detection, real meaning, open access, free tools) and uniquely fraught (making people legible without consent; openness as exposure; remote strangers with authority over local reality). The responsible version looks like fAIr: local models, human in the loop, community steering, open imagery. But open data versus data sovereignty cannot be solved inside OSM's open-everything design; humanitarian groups handle it by choosing what to map and, just as important, what to leave off.</div>` }
];

const typeOf = q => CAT2TYPE[q.cat] || "origins";

const TOOL_ICONS = {
